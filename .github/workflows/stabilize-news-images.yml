name: Stabilize news images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard image refresh
        shell: python
        run: |
          from pathlib import Path
          p=Path('dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          old="""async function renderNewsWithImages(){\n  const d=getDoc();if(!d)return;"""
          new="""let lastNewsSignature='';\nasync function renderNewsWithImages(){\n  const d=getDoc();if(!d)return;"""
          if "let lastNewsSignature=''" not in s:
              s=s.replace(old,new,1)
          old2="""    if(!valid.length){box.innerHTML='<div class=\"empty\">No se encontraron noticias climáticas relevantes de Perú.</div>';return}\n    box.innerHTML=valid.map(a=>{const [level,cls]=newsSeverity(a);"""
          new2="""    if(!valid.length){box.innerHTML='<div class=\"empty\">No se encontraron noticias climáticas relevantes de Perú.</div>';return}\n    const signature=valid.map(a=>String(a.url||a.title||'')).join('|');\n    if(signature===lastNewsSignature && box.querySelector('.climate-news-image')){const count=d.getElementById('newsCount');if(count)count.textContent=String(valid.length);return}\n    lastNewsSignature=signature;\n    box.innerHTML=valid.map(a=>{const [level,cls]=newsSeverity(a);"""
          if "const signature=valid.map(a=>String(a.url||a.title||'')).join('|')" not in s:
              s=s.replace(old2,new2,1)
          s=s.replace("onerror=\\\"this.style.display='none'\\\"", "onerror=\\\"if(!this.dataset.fallback){this.dataset.fallback='1';this.src='https://images.unsplash.com/photo-1501630834273-4b5604d2ee31?auto=format&fit=crop&w=900&q=80'}\\\"")
          s=s.replace("index-original.html?v=20261009-news-images1", "index-original.html?v=20261009-news-images2")
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          git diff --cached --quiet || git commit -m 'Stabilize news images against periodic rerender'
          git push
      - name: Remove workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/stabilize-news-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/stabilize-news-images.yml
          git diff --cached --quiet || git commit -m 'Remove one-time news image workflow'
          git push || true
