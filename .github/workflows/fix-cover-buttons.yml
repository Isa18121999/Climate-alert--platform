name: Fix cover buttons

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix cover navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          old="""(function(){const cover=document.getElementById('projectCover');const frame=document.getElementById('dashboardFrame');function enter(target){if(!cover)return;cover.style.opacity='0';cover.style.transition='opacity .35s ease';setTimeout(()=>{cover.remove();if(target)frame.contentWindow.postMessage({action:target},'*')},350)}document.getElementById('enterDashboard')?.addEventListener('click',()=>enter('dashboard'));document.getElementById('coverAlerts')?.addEventListener('click',()=>enter('alerts'));})();"""
          new="""(function(){const cover=document.getElementById('projectCover');const frame=document.getElementById('dashboardFrame');function enter(target){if(!cover)return;cover.style.opacity='0';cover.style.transition='opacity .35s ease';setTimeout(()=>{cover.remove();if(target==='alerts'){setTimeout(()=>{const d=frame.contentDocument||frame.contentWindow.document;const el=d.getElementById('capZones')||d.querySelector('#capVisual .cap-card');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},400)}else{window.scrollTo(0,0)}},350)}document.getElementById('enterDashboard')?.addEventListener('click',()=>enter('dashboard'));document.getElementById('coverAlerts')?.addEventListener('click',()=>enter('alerts'));})();"""
          if old not in s:
              raise SystemExit('cover script pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git commit -m "Fix alert button navigation" || true
          git push
          rm -f .github/workflows/fix-cover-buttons.yml
          git add .github/workflows/fix-cover-buttons.yml
          git commit -m "Remove one-time cover button workflow" || true
          git push
