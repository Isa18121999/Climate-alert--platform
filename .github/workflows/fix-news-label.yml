name: Fix news labels

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace live-news wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dashboard/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'NOTICIAS EN VIVO': 'NOTICIAS RECIENTES',
              'Noticias en vivo': 'Noticias recientes',
              'noticias en vivo': 'noticias recientes',
              'GDELT DOC 2.0 + RSS fallback': 'SENAMHI + medios peruanos',
              'clasificación automática': 'Noticias recientes',
          }
          original = text
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text == original:
              print('No se encontraron cambios necesarios.')
          else:
              path.write_text(text, encoding='utf-8')
              print('Etiquetas de noticias actualizadas.')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios para confirmar.'
          else
            git commit -m 'Change news label to recent news'
            git push
          fi
