name: Add climate map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply map patch
        run: python .github/scripts/add_map.py

      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes needed."
          else
            git commit -m "Add interactive Peru climate map"
            git push
          fi

      - name: Remove temporary patch files
        run: |
          rm -f .github/workflows/add-climate-map.yml .github/scripts/add_map.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/add-climate-map.yml .github/scripts/add_map.py
          if git diff --cached --quiet; then
            echo "Temporary patch files already removed."
          else
            git commit -m "Remove temporary climate map patch files"
            git push
          fi
