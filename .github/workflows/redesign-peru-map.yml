name: Redesign Peru risk map
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/redesign-peru-map.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Peru map dashboard design
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard/index.html')
          s=p.read_text()
          s=s.replace("#capMap{height:430px;margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid #dce8ee}", "#capMapLayout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);gap:14px;margin-top:14px}.cap-map-wrap{min-width:0}.cap-map-wrap #capMap{height:570px;margin:0;border-radius:14px;overflow:hidden;border:1px solid #dce8ee}.cap-map-panel{background:#fff;border:1px solid #dce8ee;border-radius:14px;padding:15px;min-width:0;box-shadow:0 6px 18px rgba(19,64,88,.05)}.cap-panel-title{font-weight:900;color:#15334b;font-size:13px;margin-bottom:9px}.cap-panel-note{font-size:10px;color:#6d8090;margin-bottom:10px}.cap-filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}.cap-filter{border:1px solid #d5e3e9;background:#fff;color:#365b70;border-radius:8px;padding:8px 6px;font-size:10px;font-weight:800;cursor:pointer}.cap-filter.active{background:#1479c9;color:#fff;border-color:#1479c9}.cap-risk-list{display:grid;gap:7px;margin-bottom:14px}.cap-risk{border-radius:9px;padding:9px 10px;font-size:10px;line-height:1.3;border:1px solid}.cap-risk b{display:block;margin-bottom:2px}.cap-risk.red{background:#fff0f0;border-color:#f0cccc;color:#9b2424}.cap-risk.orange{background:#fff5e6;border-color:#f1d39f;color:#9a5700}.cap-risk.yellow{background:#fffbea;border-color:#eee0a8;color:#795d00}.cap-risk.green{background:#eefaf2;border-color:#c9e7d1;color:#217246}.cap-selected{background:#f4f9fc;border:1px solid #d7e7ee;border-radius:10px;padding:11px;font-size:10px;color:#526b7b;line-height:1.5;min-height:70px}.cap-selected strong{color:#15334b;font-size:12px}.cap-station-list{margin-top:9px;max-height:170px;overflow:auto;border:1px solid #e0eaee;border-radius:9px;background:#fff}.cap-station{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-bottom:1px solid #edf2f4;font-size:9px;color:#365b70;cursor:pointer}.cap-station:last-child{border-bottom:0}.cap-station:hover{background:#f4f9fc}.cap-station-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}.cap-map-status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.cap-map-status-left{font-size:10px;color:#6d8090}.cap-map-pills{display:flex;gap:5px;flex-wrap:wrap}.cap-map-pill{padding:5px 8px;border-radius:8px;background:#f0f7fa;color:#426277;font-size:9px;font-weight:850}.cap-map-pill strong{color:#15334b}.cap-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11px;color:#526b7b}.cap-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.cap-red{background:#c53a43}.cap-orange{background:#e07a00}.cap-yellow{background:#c19a00}.cap-green{background:#1b8d68}.cap-news{display:grid;gap:11px;margin-top:14px}")
          old="<section class=\"cap-card\"><div class=\"cap-head\"><div class=\"cap-title\"><span>🗺️</span><div><h2>Mapa nacional de eventos y riesgo</h2><div class=\"cap-sub\">Solo Perú · puntos de lluvias, inundaciones, desbordes, huaicos, tormentas y otros eventos</div></div></div><div class=\"cap-status\" id=\"capMapStatus\">Cargando mapa…</div></div><div id=\"capMap\"></div><div class=\"cap-legend\"><span><i class=\"cap-red\"></i>ROJO</span><span><i class=\"cap-orange\"></i>NARANJA</span><span><i class=\"cap-yellow\"></i>AMARILLO</span><span><i class=\"cap-green\"></i>Sin aviso</span></div></section>"
          new="<section class=\"cap-card\"><div class=\"cap-head\"><div class=\"cap-title\"><span>🗺️</span><div><h2>Mapa de Riesgo y Eventos del Perú</h2><div class=\"cap-sub\">Distribución de lluvias, desastres, avisos SENAMHI y zonas vulnerables en Costa, Sierra y Selva.</div></div></div><div class=\"cap-status\" id=\"capMapStatus\">Cargando…</div></div><div class=\"cap-map-status\"><div class=\"cap-map-status-left\">Estado del mapa: <b id=\"capMapState\">Consultando datos</b></div><div class=\"cap-map-pills\"><span class=\"cap-map-pill\">🇵🇪 Perú</span><span class=\"cap-map-pill\">Datos en vivo</span></div></div><div id=\"capMapLayout\"><div class=\"cap-map-wrap\"><div id=\"capMap\"></div></div><aside class=\"cap-map-panel\"><div class=\"cap-panel-title\">☷ Región Natural</div><div class=\"cap-panel-note\">Filtra las zonas del territorio peruano</div><div class=\"cap-filter-grid\"><button class=\"cap-filter active\" data-region=\"all\">Todas</button><button class=\"cap-filter\" data-region=\"Costa\">Región Costa</button><button class=\"cap-filter\" data-region=\"Sierra\">Región Sierra</button><button class=\"cap-filter\" data-region=\"Selva\">Región Selva</button></div><div class=\"cap-panel-title\">⚠ Filtrar por Riesgo</div><div class=\"cap-filter-grid\"><button class=\"cap-filter active\" data-risk=\"all\">Todos</button><button class=\"cap-filter\" data-risk=\"critical\">ROJO</button><button class=\"cap-filter\" data-risk=\"high\">NARANJA</button><button class=\"cap-filter\" data-risk=\"medium\">AMARILLO</button></div><div class=\"cap-panel-title\">Leyenda de Colores</div><div class=\"cap-risk-list\"><div class=\"cap-risk red\"><b>🔴 Rojo · Riesgo crítico</b>Desbordes, inundaciones, huaicos y emergencias.</div><div class=\"cap-risk orange\"><b>🟠 Naranja · Riesgo alto</b>Lluvias intensas, tormentas, caudales y deslizamientos.</div><div class=\"cap-risk yellow\"><b>🟡 Amarillo · Riesgo moderado</b>Precipitaciones y eventos de vigilancia.</div><div class=\"cap-risk green\"><b>🟢 Sin aviso</b>Zona sin evento climático detectado.</div></div><div class=\"cap-panel-title\">📍 Punto seleccionado</div><div id=\"capSelected\" class=\"cap-selected\"><strong>Selecciona un punto</strong><br>Toca un marcador del mapa para ver su información.</div><div class=\"cap-panel-title\" style=\"margin-top:13px\">Cambiar de zona</div><div id=\"capStationList\" class=\"cap-station-list\"></div></aside></div><div class=\"cap-legend\"><span><i class=\"cap-red\"></i>ROJO</span><span><i class=\"cap-orange\"></i>NARANJA</span><span><i class=\"cap-yellow\"></i>AMARILLO</span><span><i class=\"cap-green\"></i>Sin aviso</span></div></section>"
          if old not in s: raise SystemExit('map section not found')
          s=s.replace(old,new)
          s=s.replace("@media(max-width:650px){.cap-card{padding:16px;border-radius:18px}.cap-zones,.cap-stats{grid-template-columns:1fr}.cap-head{flex-direction:column}.cap-status{align-self:stretch}.cap-news-item{padding:10px}.cap-news-img,.cap-news-placeholder{width:92px;height:70px}.cap-news-desc{display:none}#capMap{height:330px}}", "@media(max-width:900px){#capMapLayout{grid-template-columns:1fr}.cap-map-wrap #capMap{height:430px}.cap-map-panel{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cap-panel-title,.cap-panel-note{grid-column:1/-1}.cap-risk-list,.cap-selected,.cap-station-list{grid-column:1/-1}}@media(max-width:650px){.cap-card{padding:16px;border-radius:18px}.cap-zones,.cap-stats{grid-template-columns:1fr}.cap-head{flex-direction:column}.cap-status{align-self:stretch}.cap-news-item{padding:10px}.cap-news-img,.cap-news-placeholder{width:92px;height:70px}.cap-news-desc{display:none}#capMapLayout{grid-template-columns:1fr}.cap-map-wrap #capMap{height:340px}.cap-map-panel{display:block}.cap-map-status{align-items:flex-start;flex-direction:column}}")
          oldfun="async function renderMap(){const d=doc(),box=d.getElementById('capMap');if(!box)return;const L=await loadLeaflet();if(!map){map=L.map(box,{scrollWheelZoom:true}).setView([-9.2,-75],5.2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap contributors'}).addTo(map)}markers.forEach(x=>x.remove());markers=[];const events=[...officialCache.filter(current),...newsCache.filter(isNewsRelevant)];PERU.forEach(([name,lat,lon])=>{const matched=events.filter(a=>regionMatch(a,name));const ranks={critical:4,high:3,medium:2,green:1};const best=matched.map(severity).sort((a,b)=>ranks[b[1]]-ranks[a[1]])[0]||['','green'];const color=best[1]==='critical'?'#c53a43':best[1]==='high'?'#e07a00':best[1]==='medium'?'#c19a00':'#1b8d68';const marker=L.circleMarker([lat,lon],{radius:matched.length?9:6,fillColor:color,color:'#fff',weight:2,fillOpacity:.9}).addTo(map);if(matched.length){const body=matched.slice(0,4).map(popupFor).join('<hr style=\"border:0;border-top:1px solid #ddd;margin:7px 0\">');marker.bindPopup(`<strong>🇵🇪 ${safe(name)}</strong><br><b>${matched.length} evento(s)</b><hr style=\"border:0;border-top:1px solid #ddd;margin:7px 0\">${body}`)}else marker.bindPopup(`<strong>🇵🇪 ${safe(name)}</strong><br>Sin evento climático detectado en las fuentes consultadas.`);markers.push(marker)});const st=d.getElementById('capMapStatus');if(st)st.textContent='Perú · '+events.filter(current).length+' avisos actuales · '+newsCache.filter(isNewsRelevant).length+' noticias';setTimeout(()=>map.invalidateSize(),200)}"
          newfun="async function renderMap(){const d=doc(),box=d.getElementById('capMap');if(!box)return;const L=await loadLeaflet();if(!map){map=L.map(box,{scrollWheelZoom:true,zoomControl:true,maxBounds:[[-19.5,-82.5],[-0.2,-68.3]],maxBoundsViscosity:1}).setView([-9.2,-75],5.5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,minZoom:4,attribution:'© OpenStreetMap contributors'}).addTo(map)}markers.forEach(x=>x.remove());markers=[];const events=[...officialCache.filter(current),...newsCache.filter(isNewsRelevant)];const ranks={critical:4,high:3,medium:2,green:1};const regionMap={Tumbes:'Costa',Piura:'Costa',Lambayeque:'Costa',Cajamarca:'Sierra',Amazonas:'Selva',Loreto:'Selva', 'San Martín':'Selva','La Libertad':'Costa','Áncash':'Costa','Huánuco':'Sierra',Pasco:'Sierra',Junín:'Sierra',Lima:'Costa',Callao:'Costa',Ica:'Costa',Huancavelica:'Sierra',Ayacucho:'Sierra',Apurímac:'Sierra',Cusco:'Sierra','Madre de Dios':'Selva',Arequipa:'Costa',Moquegua:'Costa',Tacna:'Costa',Puno:'Sierra',Ucayali:'Selva'};let selectedRegion='all',selectedRisk='all';function draw(){markers.forEach(x=>x.remove());markers=[];const stationList=d.getElementById('capStationList');const rows=[];PERU.forEach(([name,lat,lon])=>{const matched=events.filter(a=>regionMatch(a,name));const best=matched.map(severity).sort((a,b)=>ranks[b[1]]-ranks[a[1]])[0]||['','green'];const risk=best[1];if(selectedRegion!=='all'&&regionMap[name]!==selectedRegion)return;if(selectedRisk!=='all'&&risk!==selectedRisk)return;const color=risk==='critical'?'#c53a43':risk==='high'?'#e07a00':risk==='medium'?'#c19a00':'#1b8d68';const marker=L.circleMarker([lat,lon],{radius:matched.length?9:6,fillColor:color,color:'#fff',weight:2,fillOpacity:.92}).addTo(map);marker.on('click',()=>{const box=d.getElementById('capSelected');if(box)box.innerHTML=`<strong>🇵🇪 ${safe(name)}</strong><br>${matched.length?matched.slice(0,3).map(p=>`<b>${safe(severity(p)[0])}</b> · ${safe(p.title||p.name||'Evento climático')}<br>${safe(p.description||p.message||'Sin descripción disponible.').slice(0,260)}<br><small>${safe(sourceOf(p))} · ${safe(dateOf(p)||'Fecha no indicada')}</small>`).join('<hr style=\"border:0;border-top:1px solid #dce8ee\">'):'Sin evento climático detectado en las fuentes consultadas.'}`;marker.openPopup()});const popup=matched.length?matched.slice(0,4).map(popupFor).join('<hr style=\"border:0;border-top:1px solid #ddd;margin:7px 0\">'):'Sin evento climático detectado en las fuentes consultadas.';marker.bindPopup(`<strong>🇵🇪 ${safe(name)}</strong><br><b>${matched.length} evento(s)</b><hr style=\"border:0;border-top:1px solid #ddd;margin:7px 0\">${popup}`);markers.push(marker);rows.push({name,lat,lon,risk,matched});});if(stationList)stationList.innerHTML=rows.map(r=>`<div class=\"cap-station\" data-lat=\"${r.lat}\" data-lon=\"${r.lon}\"><span><i class=\"cap-station-dot\" style=\"background:${r.risk==='critical'?'#c53a43':r.risk==='high'?'#e07a00':r.risk==='medium'?'#c19a00':'#1b8d68'}\"></i>${safe(r.name)}</span><span>${r.matched.length?safe(severity(r.matched[0])[0]):'Normal'}</span></div>`).join('');stationList?.querySelectorAll('.cap-station').forEach(el=>el.onclick=()=>{map.setView([+el.dataset.lat,+el.dataset.lon],7,{animate:true});const m=markers.find(x=>{const ll=x.getLatLng();return Math.abs(ll.lat-(+el.dataset.lat))<.01&&Math.abs(ll.lng-(+el.dataset.lon))<.01});if(m)m.fire('click')});const state=d.getElementById('capMapState');if(state)state.textContent=`${rows.filter(r=>r.risk!=='green').length} zonas con riesgo · ${rows.length} puntos consultables`;const st=d.getElementById('capMapStatus');if(st)st.textContent=`Perú · ${events.filter(current).length} avisos · ${newsCache.filter(isNewsRelevant).length} noticias`;setTimeout(()=>map.invalidateSize(),200)}document.querySelectorAll('#capVisual [data-region]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#capVisual [data-region]').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedRegion=b.dataset.region;draw()});document.querySelectorAll('#capVisual [data-risk]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#capVisual [data-risk]').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedRisk=b.dataset.risk;draw()});draw() }"
          if oldfun not in s: raise SystemExit('renderMap function not found')
          s=s.replace(oldfun,newfun)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git diff --cached --quiet || git commit -m "Aplicar diseño de mapa nacional de riesgo"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/redesign-peru-map.yml
          git commit -m "Remove one-time map redesign workflow"
          git push