name: Fix official history UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dashboard/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'async function loadAWS(){'
          if 'function renderHistoricalOfficialFallback()' not in text:
              fallback = r'''function renderHistoricalOfficialFallback(){
            const items=[
              {number:'269',title:'INCREMENTO DE VIENTO EN LA SIERRA NORTE',start_at:'2026-07-07',end_at:'2026-07-09',level:'NARANJA'},
              {number:'268',title:'INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA (EXTENSIÓN DEL AVISO 266)',start_at:'2026-07-07',end_at:'2026-07-09',level:'NARANJA'},
              {number:'267',title:'NEVADA EN LA SIERRA CENTRO Y SUR (EXTENSIÓN DEL AVISO 261)',start_at:'2026-07-04',end_at:'2026-07-04',level:'AMARILLO'},
              {number:'266',title:'INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA',start_at:'2026-07-04',end_at:'2026-07-06',level:'NARANJA'},
              {number:'265',title:'INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR',start_at:'2026-07-05',end_at:'2026-07-06',level:'NARANJA'},
              {number:'264',title:'DESCENSO DE TEMPERATURA DIURNA EN LA SELVA - QUINTO FRIAJE',start_at:'2026-07-03',end_at:'2026-07-04',level:'NARANJA'},
              {number:'263',title:'INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR',start_at:'2026-07-03',end_at:'2026-07-04',level:'NARANJA'},
              {number:'262',title:'LLUVIA EN LA SELVA - QUINTO FRIAJE',start_at:'2026-07-02',end_at:'2026-07-03',level:'AMARILLO'},
              {number:'261',title:'NEVADA EN LA SIERRA CENTRO Y SUR',start_at:'2026-07-02',end_at:'2026-07-03',level:'NARANJA'},
              {number:'260',title:'INCREMENTO DE VIENTO EN LA SIERRA',start_at:'2026-07-01',end_at:'2026-07-03',level:'AMARILLO'}
            ];
            const html=items.map(x=>{const cls=x.level==='NARANJA'?'high':'medium';const badge=x.level==='NARANJA'?'danger':'warn';return `<div class="alert-card official ${cls}"><div><span class="badge ${badge}">HISTÓRICO</span> <span class="alert-title">${x.title}</span></div><div class="alert-meta">SENAMHI · N.º ${x.number} · Inicio: ${x.start_at} · Fin: ${x.end_at} · Aviso pasado</div><a class="alert-link" href="https://web2.senamhi.gob.pe/?p=avisos" target="_blank" rel="noopener">Ver aviso oficial</a></div>`}).join('');
            if($('pastOfficialAlerts')) $('pastOfficialAlerts').innerHTML=html;
            if($('pastOfficialTitle')) $('pastOfficialTitle').style.display='block';
            if($('currentOfficialTitle')) $('currentOfficialTitle').style.display='block';
            if($('alertsStatus')) $('alertsStatus').textContent='Histórico oficial disponible · consultando SENAMHI…';
          }

          '''
              text = text.replace(marker, fallback + marker, 1)
          text = text.replace("async function loadAWS(){\n  if(!api())", "async function loadAWS(){\n  renderHistoricalOfficialFallback();\n  if(!api())", 1)
          text = text.replace("readNewsCache();\nrefreshAll();", "readNewsCache();\nrenderHistoricalOfficialFallback();\nrefreshAll();", 1)
          text = text.replace("$('alertsStatus').textContent='No se pudieron consultar las alertas.';", "$('alertsStatus').textContent='Histórico oficial disponible · SENAMHI no respondió en este momento.';\n    renderHistoricalOfficialFallback();", 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git rm .github/workflows/fix-official-history-ui.yml
          git commit -m "Fix official history UI"
          git push
