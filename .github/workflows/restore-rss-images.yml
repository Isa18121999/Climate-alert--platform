name: Restore RSS news images

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore RSS image extraction in API
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/app.py')
          s = p.read_text(encoding='utf-8')
          if 'def _rss_image(' not in s:
              marker = 'def _news_severity(title: str, description: str = "") -> str:\n'
              helper = '''def _rss_image(item: ET.Element, description: str = "") -> str | None:\n    """Extract the real image URL from RSS/Media RSS, with HTML fallback."""\n    for child in item.iter():\n        tag = child.tag.split("}")[-1].lower() if isinstance(child.tag, str) else ""\n        if tag in {"content", "thumbnail", "image", "enclosure"}:\n            url = (child.attrib.get("url") or child.attrib.get("href") or "").strip()\n            if url.startswith(("https://", "http://")):\n                return url\n    if description:\n        img = BeautifulSoup(description, "html.parser").find("img", src=True)\n        if img:\n            url = str(img.get("src") or "").strip()\n            if url.startswith(("https://", "http://")):\n                return url\n    return None\n\n\n'''
              s = s.replace(marker, helper + marker, 1)
          s = s.replace('description: str = "", pub_date: str | None = None, category: str = "") -> None:', 'description: str = "", pub_date: str | None = None, category: str = "", image_url: str | None = None) -> None:', 1)
          s = s.replace('"description": description, "summary": description[:500], "socialimage": None,\n        "country":', '"description": description, "summary": description[:500], "socialimage": image_url, "image_url": image_url,\n        "country":', 1)
          old = '''                         item.findtext("description") or "", item.findtext("pubDate"),\n                         " ".join(x.text or "" for x in item.findall("category")))'''
          new = '''                         item.findtext("description") or "", item.findtext("pubDate"),\n                         " ".join(x.text or "" for x in item.findall("category")),\n                         _rss_image(item, item.findtext("description") or ""))'''
          s = s.replace(old, new, 1)
          old2 = '''                     item.find("description").get_text(" ", strip=True) if item.find("description") else "",\n                     item.find("pubDate").get_text(" ", strip=True) if item.find("pubDate") else None,\n                     " ".join(x.get_text(" ", strip=True) for x in item.find_all("category")))'''
          new2 = '''                     item.find("description").get_text(" ", strip=True) if item.find("description") else "",\n                     item.find("pubDate").get_text(" ", strip=True) if item.find("pubDate") else None,\n                     " ".join(x.get_text(" ", strip=True) for x in item.find_all("category")),\n                     _rss_image(item, item.find("description").decode_contents() if item.find("description") else ""))'''
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile api/app.py
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/app.py .github/workflows/restore-rss-images.yml
          git rm .github/workflows/restore-rss-images.yml
          git commit -m "Restaurar imágenes reales desde RSS en noticias"
          git push
