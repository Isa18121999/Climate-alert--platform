name: Fix historical SENAMHI alerts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-past-alerts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch historical alerts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/senamhi.py')
          s = p.read_text(encoding='utf-8')
          old = '''    parsed_past = [a for a in alerts if _status(a, now_dt) == "PASADO"]
    if not parsed_past:
        alerts.extend(_historical_fallback())
'''
          new = '''    parsed_past = [a for a in alerts if _status(a, now_dt) == "PASADO"]
    # Garantizar que el dashboard siempre tenga un historial oficial visible.
    # Se mezclan los registros históricos conocidos con los obtenidos en vivo;
    # el diccionario posterior evita duplicados por ID.
    historical = _historical_fallback()
    known_ids = {a.get("id") for a in alerts}
    alerts.extend(a for a in historical if a.get("id") not in known_ids)
'''
          if old not in s:
              raise SystemExit('Bloque esperado no encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/senamhi.py
          git diff --cached --quiet && exit 0
          git commit -m 'Ensure historical SENAMHI alerts are always available'
          git push
