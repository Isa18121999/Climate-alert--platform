AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Propuesta 1 - Alerta temprana de lluvias extremas e inundaciones

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        MEASUREMENTS_TABLE: !Ref MeasurementsTable
        ALERTS_TABLE: !Ref AlertsTable
        SNS_TOPIC_ARN: !Ref AlertTopic
        DEFAULT_LAT: "-5.1945"
        DEFAULT_LON: "-80.6328"
        DEFAULT_STATION_ID: "PIURA-001"

Resources:
  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: climate-alert-platform-alert
      CodeUri: src/
      Handler: handler.app
      Role: arn:aws:iam::348802848943:role/LabRole
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
            - POST
            - OPTIONS
          AllowHeaders:
            - content-type
      Events:
        ScheduledMonitor:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Input: '{"action":"monitor"}'

  MeasurementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: station_id
          AttributeType: S
        - AttributeName: measurement_id
          AttributeType: S
      KeySchema:
        - AttributeName: station_id
          KeyType: HASH
        - AttributeName: measurement_id
          KeyType: RANGE

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: station_id
          AttributeType: S
        - AttributeName: alert_id
          AttributeType: S
      KeySchema:
        - AttributeName: station_id
          KeyType: HASH
        - AttributeName: alert_id
          KeyType: RANGE

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: propuesta1-alertas

Outputs:
  FunctionUrl:
    Description: URL publica de la Lambda para el dashboard
    Value: !GetAtt AlertFunctionUrl.FunctionUrl
  TopicArn:
    Description: ARN del topico SNS
    Value: !Ref AlertTopic
