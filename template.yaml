AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Propuesta 1 - Alerta temprana de lluvias extremas e inundaciones

Globals:
  Function:
    Runtime: python3.13
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        MEASUREMENTS_TABLE: !Ref MeasurementsTable
        ALERTS_TABLE: !Ref AlertsTable
        SNS_TOPIC_ARN: !Ref AlertTopic
        DEFAULT_LAT: "-5.1945"
        DEFAULT_LON: "-80.6328"
        DEFAULT_STATION_ID: "PIURA-001"

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.app
      Role: arn:aws:iam::348802848943:role/LabRole
      Events:
        ScheduledMonitor:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Input: '{"action":"monitor"}'
        PostMeasurement:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /measurements
            Method: POST
        ListMeasurements:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /measurements
            Method: GET
        ListAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /alerts
            Method: GET
        Weather:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /weather
            Method: GET
        Flood:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /flood
            Method: GET
        News:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /news
            Method: GET
        OfficialAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /official-alerts
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /health
            Method: GET

  MeasurementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: station_id
          AttributeType: S
        - AttributeName: measurement_id
          AttributeType: S
      KeySchema:
        - AttributeName: station_id
          KeyType: HASH
        - AttributeName: measurement_id
          KeyType: RANGE

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: station_id
          AttributeType: S
        - AttributeName: alert_id
          AttributeType: S
      KeySchema:
        - AttributeName: station_id
          KeyType: HASH
        - AttributeName: alert_id
          KeyType: RANGE

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: propuesta1-alertas

Outputs:
  ApiUrl:
    Description: URL de la API
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  TopicArn:
    Description: ARN del tópico SNS
    Value: !Ref AlertTopic
