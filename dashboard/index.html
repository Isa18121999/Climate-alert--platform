<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Climate Alert Platform</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dashboardFrame" src="index-original.html?v=20261010-images047" title="Climate Alert Platform"></iframe>
<script>
/* Capa de estabilidad y presentación: conserva datos válidos y restaura las imágenes
   reales entregadas por el backend de noticias, sin reemplazarlas por imágenes genéricas. */
const frame=document.getElementById('dashboardFrame');
let cachedMeasurements='',cachedMeasurementStatus='',cachedNews='',cachedNewsStatus='',cachedCurrentAlerts='',cachedPastAlerts='',cachedSystemAlerts='',cachedAlertsStatus='';
let newsImageMap=new Map();
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
function usefulText(text){return text&&!/no hay|sin avisos|aún no hay|conecta la api|no se pudieron cargar|no se pudieron consultar/i.test(text)}
function nonEmptyChildren(el){return el&&Array.from(el.children).some(x=>usefulText((x.textContent||'').trim()))}
function saveLocal(k,v){try{if(v)localStorage.setItem(k,v)}catch(e){}}
function loadLocal(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}

async function loadNewsImages(){
 try{
  const d=doc();if(!d)return;
  const api=d.getElementById('api');
  const base=(api&&api.value?api.value:'').replace(/\/$/,'');
  if(!base)return;
  const response=await fetch(base+'/news?query=Perú%20alerta%20climática',{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  const articles=Array.isArray(data.articles)?data.articles:[];
  newsImageMap=new Map(articles.map(a=>[(a.title||'').trim().toLowerCase(),a.socialimage||a.image_url||'']).filter(x=>x[1]));
  patchVisuals();
 }catch(e){console.warn('No se pudieron recuperar las imágenes reales de noticias:',e)}
}

function patchVisuals(){
 try{
  const d=doc();if(!d||!d.head||!d.body)return;
  if(!d.getElementById('capVisualFix')){
   const s=d.createElement('style');s.id='capVisualFix';s.textContent=`
    .badge.low,.news-level.low{background:#def6e8!important;color:#15723e!important}
    .alert-card.low{border-left-color:#1b8d68!important}
    .news-item .cap-news-image{width:112px;height:76px;object-fit:cover;border-radius:12px;flex:0 0 112px;background:#eaf4f6}
    @media(max-width:650px){.news-item .cap-news-image{width:86px;height:64px;flex-basis:86px}}
   `;d.head.appendChild(s);
  }
  d.querySelectorAll('.news-item').forEach(item=>{
   let img=item.querySelector('.cap-news-image');
   if(!img){
    img=d.createElement('img');
    img.className='cap-news-image';
    img.alt='Imagen relacionada con noticia climática';
    img.loading='lazy';
    img.onerror=()=>{img.style.display='none'};
    item.insertBefore(img,item.firstChild);
   }
   const link=item.querySelector('a');
   const title=((link&&link.textContent)||'').trim().toLowerCase();
   const article=newsImageMap.get(title);
   const imageUrl=article||'';
   if(imageUrl && img.src!==imageUrl)img.src=imageUrl;
  });
 }catch(e){console.warn('Corrección visual:',e)}
}

function stabilize(){
 try{
  const d=doc();if(!d||!d.body)return;
  const rows=d.getElementById('rows'),ms=d.getElementById('measurements');
  if(rows&&nonEmptyChildren(rows)){cachedMeasurements=rows.innerHTML;cachedMeasurementStatus=ms&&usefulText(ms.textContent||'')?ms.textContent:cachedMeasurementStatus;saveLocal('cap_measurements_html',cachedMeasurements);saveLocal('cap_measurements_status',cachedMeasurementStatus)}
  else if(rows){cachedMeasurements=loadLocal('cap_measurements_html');cachedMeasurementStatus=loadLocal('cap_measurements_status');if(cachedMeasurements)rows.innerHTML=cachedMeasurements;if(ms&&cachedMeasurementStatus)ms.textContent=cachedMeasurementStatus}
  const news=d.getElementById('news'),ns=d.getElementById('newsStatus');
  if(news&&news.querySelector('.news-item')){cachedNews=news.innerHTML;cachedNewsStatus=ns&&usefulText(ns.textContent||'')?ns.textContent:cachedNewsStatus;saveLocal('cap_news_html',cachedNews);saveLocal('cap_news_status',cachedNewsStatus)}
  else if(news){cachedNews=loadLocal('cap_news_html');cachedNewsStatus=loadLocal('cap_news_status');if(cachedNews)news.innerHTML=cachedNews;if(ns&&cachedNewsStatus)ns.textContent=cachedNewsStatus}
  const current=d.getElementById('officialAlerts'),past=d.getElementById('pastOfficialAlerts'),system=d.getElementById('systemAlerts'),as=d.getElementById('alertsStatus');
  if(current&&nonEmptyChildren(current)){cachedCurrentAlerts=current.innerHTML;saveLocal('cap_current_alerts',cachedCurrentAlerts)}else if(current){cachedCurrentAlerts=loadLocal('cap_current_alerts');if(cachedCurrentAlerts)current.innerHTML=cachedCurrentAlerts}
  if(past&&nonEmptyChildren(past)){cachedPastAlerts=past.innerHTML;saveLocal('cap_past_alerts',cachedPastAlerts)}else if(past){cachedPastAlerts=loadLocal('cap_past_alerts');if(cachedPastAlerts)past.innerHTML=cachedPastAlerts}
  if(system&&nonEmptyChildren(system)){cachedSystemAlerts=system.innerHTML;saveLocal('cap_system_alerts',cachedSystemAlerts)}else if(system){cachedSystemAlerts=loadLocal('cap_system_alerts');if(cachedSystemAlerts)system.innerHTML=cachedSystemAlerts}
  if(as&&usefulText(as.textContent||'')){cachedAlertsStatus=as.textContent;saveLocal('cap_alerts_status',cachedAlertsStatus)}else if(as){cachedAlertsStatus=loadLocal('cap_alerts_status');if(cachedAlertsStatus)as.textContent=cachedAlertsStatus}
 }catch(e){console.warn('Estabilidad:',e)}
}

function patchCounter(){try{const d=doc();if(!d||!d.body)return;const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n,c=null;while(n=walker.nextNode()){if(/SENAMHI:\s*\d+\s*(?:vigentes|actuales?)\s*[·•]\s*\d+\s*pasados?/i.test(n.nodeValue||'')){c=n.parentElement;break}}if(!c)return;const count=b=>b?Array.from(b.children).filter(x=>usefulText((x.textContent||'').trim())).length:0;c.textContent=`SENAMHI: ${count(d.getElementById('officialAlerts'))} actuales · ${count(d.getElementById('pastOfficialAlerts'))} pasados`}catch(e){}}
function patchSeverity(){try{const d=doc();if(!d)return;d.querySelectorAll('.badge').forEach(b=>{const t=(b.textContent||'').trim().toUpperCase();if(t==='BAJO')b.classList.add('low')})}catch(e){}}
function tick(){stabilize();patchVisuals();patchCounter();patchSeverity()}
frame.addEventListener('load',()=>{loadNewsImages();tick();setTimeout(loadNewsImages,1000);setTimeout(tick,300);setTimeout(tick,1000);setTimeout(tick,2500);setInterval(()=>{tick();loadNewsImages()},30000);try{const d=doc();if(d&&d.body){new MutationObserver(tick).observe(d.body,{childList:true,subtree:true)}}catch(e){}});
</script>
</body>
</html>
