<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Climate Alert Platform</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="dashboardFrame" src="index-original.html?v=20261009-senamhi-counter4" title="Climate Alert Platform"></iframe>
<script>
const frame=document.getElementById('dashboardFrame');
function patch(){
  try{
    const d=frame.contentDocument;if(!d)return;
    const body=d.body;if(!body)return;
    const walker=d.createTreeWalker(body,NodeFilter.SHOW_TEXT);
    const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
    nodes.forEach(node=>{
      if(!node.nodeValue.includes('SENAMHI:'))return;
      const el=node.parentElement;
      if(!el)return;
      if(el.dataset.senamhiCounterPatched==='1')return;
      el.dataset.senamhiCounterPatched='1';
      const original=node.nodeValue;
      const m=original.match(/SENAMHI:\s*(\d+)\s*(?:vigentes|actuales?)\s*[·•]\s*(\d+)\s*pasados?/i);
      if(m){
        el.textContent=original.replace(m[0],`SENAMHI: ${m[1]} actuales · ${m[2]} pasados`);
      }
    });
  }catch(e){console.warn('No se pudo actualizar el contador SENAMHI',e)}
}
frame.addEventListener('load',()=>{patch();setTimeout(patch,500);setTimeout(patch,1500);setInterval(patch,3000)});
</script>
</body>
</html>
