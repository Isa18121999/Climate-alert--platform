<head>
<meta charset="utf-8">

<title>Climate Alert Platform</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="index-original.html?v=20261005-current-risk2" title="Climate Alert Platform"></iframe>
<script>
const HIST=[
['269','INCREMENTO DE VIENTO EN LA SIERRA NORTE','2026-07-07','2026-07-09','NARANJA'],
['268','INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA (EXTENSIÓN DEL AVISO 266)','2026-07-07','2026-07-09','NARANJA'],
['267','NEVADA EN LA SIERRA CENTRO Y SUR (EXTENSIÓN DEL AVISO 261)','2026-07-04','2026-07-04','AMARILLO'],
['266','INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA','2026-07-04','2026-07-06','NARANJA'],
['265','INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR','2026-07-05','2026-07-06','NARANJA'],
['264','DESCENSO DE TEMPERATURA DIURNA EN LA SELVA - QUINTO FRIAJE','2026-07-03','2026-07-04','NARANJA'],
['263','INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR','2026-07-03','2026-07-04','NARANJA'],
['262','LLUVIA EN LA SELVA - QUINTO FRIAJE','2026-07-02','2026-07-03','AMARILLO'],
['261','NEVADA EN LA SIERRA CENTRO Y SUR','2026-07-02','2026-07-03','NARANJA'],
['260','INCREMENTO DE VIENTO EN LA SIERRA','2026-07-01','2026-07-03','AMARILLO']
];
function fixHistory(){
  const f=document.getElementById('app');
  let d;try{d=f.contentDocument;if(!d||!d.getElementById('pastOfficialAlerts'))return}catch(e){return}
  const box=d.getElementById('pastOfficialAlerts');
  const title=d.getElementById('pastOfficialTitle');
  const status=d.getElementById('alertsStatus');
  const html=HIST.map(x=>{const extrema=x[4]==='ROJO';const cls=extrema?'critical':'medium';const badge=extrema?'danger':'warn';const level=extrema?'EXTREMA':x[4]==='NARANJA'?'FUERTE':'MODERADA';return '<div class="alert-card official '+cls+'"><div><span class="badge '+badge+'">'+level+'</span> <span class="alert-title">'+x[1]+'</span></div><div class="alert-meta">SENAMHI · N.º '+x[0]+' · Inicio: '+x[2]+' · Fin: '+x[3]+' · Aviso pasado</div><a class="alert-link" href="https://web2.senamhi.gob.pe/?p=avisos" target="_blank" rel="noopener">Ver aviso oficial</a></div>'}).join('');
  const empty=box&&(box.children.length===0||box.querySelector('.empty')||/No hay avisos oficiales pasados disponibles/i.test(box.textContent||''));
  if(empty){box.innerHTML=html;box.dataset.fixed='1'}
  if(title)title.style.display='block';
  if(status){status.textContent=status.textContent.replace(/\s*·\s*alertas calculadas.*$/i,'');if(status.textContent==='Consultando alertas…')status.textContent='Histórico oficial disponible · SENAMHI'}
}
function normalizeSeverity(){
  const f=document.getElementById('app');
  let d;try{d=f.contentDocument;if(!d)return}catch(e){return}
  d.querySelectorAll('.alert-card').forEach(card=>{
    const cls=card.className||'';
    const first=card.querySelector('div');
    if(!first)return;
    const existing=first.querySelector('.badge:not(.severity-badge)');
    const source=((existing&&existing.textContent)||'').trim().toUpperCase();
    let level=null,badgeClass=null;
    if(source.includes('ROJO')||/\bcritical\b/.test(cls)){level='EXTREMA';badgeClass='danger'}
    else if(source.includes('NARANJA')||/\bhigh\b/.test(cls)){level='FUERTE';badgeClass='warn'}
    else if(source.includes('AMARILLO')||/\bmedium\b/.test(cls)){level='MODERADA';badgeClass='warn'}
    else if(source.includes('VERDE')||/\blow\b/.test(cls)){level='BAJA';badgeClass='ok'}
    else return;
    first.querySelectorAll('.badge').forEach(b=>b.remove());
    const badge=d.createElement('span');
    badge.className='badge severity-badge '+badgeClass;
    badge.textContent=level;
    first.insertBefore(badge,first.firstChild);
    if(/\bhigh\b/.test(cls)||/\bmedium\b/.test(cls)){card.classList.remove('high');card.classList.add('medium')}
  });
}
function moveCalculatedAlertsToCurrent(){
  const f=document.getElementById('app');
  let d;try{d=f.contentDocument;if(!d)return}catch(e){return}
  const source=d.getElementById('systemAlerts');
  const target=d.getElementById('officialAlerts');
  if(!source||!target)return;
  const cards=[...source.querySelectorAll('.alert-card')];
  if(!cards.length)return;
  const marker='calculated-current-marker';
  if(!target.querySelector('.'+marker)){
    const label=d.createElement('div');
    label.className='label '+marker;
    label.style.marginTop='12px';
    label.textContent='⚠️ Riesgo calculado por Climate Alert';
    target.appendChild(label);
  }
  const markerEl=target.querySelector('.'+marker);
  cards.forEach(card=>{
    const key=(card.textContent||'').trim();
    if(![...target.querySelectorAll('.alert-card')].some(x=>(x.textContent||'').trim()===key)){
      target.appendChild(card);
    }
  });
  source.innerHTML='';
}
function fix(){fixHistory();normalizeSeverity();moveCalculatedAlertsToCurrent()}
const f=document.getElementById('app');
f.addEventListener('load',()=>{fix();setInterval(fix,1500)});
</script>
</body>
</html>
