/* Mapa meteorológico interactivo de Perú: se inserta sin cambiar el resto del dashboard. */
.climate-map-card{margin-top:16px}

function getDoc(){const f=document.getElementById('app');try{return f&&f.contentDocument?f.contentDocument:null}catch(e){return null}}
function patchNewsFetch(){
  const f=document.getElementById('app');
  try{
    const w=f&&f.contentWindow;if(!w||w.__newsFetchPatched)return;
    const originalFetch=w.fetch.bind(w);
    w.fetch=function(url,options){
      const target=String(url||'');
      if(/\/news(?:\?|$)/i.test(target))return originalFetch(url,{...(options||{}),cache:'no-store'});
      return originalFetch(url,options);
    };
    w.__newsFetchPatched=true;
  }catch(e){console.warn('No se pudo preparar la carga de noticias:',e)}
}
function fixHistory(){
  const d=getDoc();if(!d||!d.getElementById('pastOfficialAlerts'))return;
  const box=d.getElementById('pastOfficialAlerts'),title=d.getElementById('pastOfficialTitle'),status=d.getElementById('alertsStatus');
  const html=HIST.map(x=>{const extrema=x[4]==='ROJO',cls=extrema?'critical':'medium',badge=extrema?'danger':'warn',level=extrema?'EXTREMA':x[4]==='NARANJA'?'FUERTE':'MODERADA';return '<div class="alert-card official '+cls+'"><div><span class="badge '+badge+'">'+level+'</span> <span class="alert-title">'+x[1]+'</span></div><div class="alert-meta">SENAMHI · N.º '+x[0]+' · Inicio: '+x[2]+' · Fin: '+x[3]+' · Aviso pasado</div><a class="alert-link" href="https://web2.senamhi.gob.pe/?p=avisos" target="_blank" rel="noopener">Ver aviso oficial</a></div>'}).join('');
  const empty=box.children.length===0||box.querySelector('.empty')||/No hay avisos oficiales pasados disponibles/i.test(box.textContent||'');
  if(empty){box.innerHTML=html;box.dataset.fixed='1'}
  if(title)title.style.display='block';
  if(status)status.textContent=status.textContent.replace(/\s*·\s*alertas calculadas.*$/i,'');
}
function normalizeSeverity(){
  const d=getDoc();if(!d)return;
  d.querySelectorAll('.alert-card').forEach(card=>{
    const cls=card.className||'',first=card.querySelector('div');if(!first)return;
    const existing=first.querySelector('.badge:not(.severity-badge)'),source=((existing&&existing.textContent)||'').trim().toUpperCase();
    let level=null,badgeClass=null;
    if(source.includes('ROJO')||/\bcritical\b/.test(cls)){level='EXTREMA';badgeClass='danger'}
    else if(source.includes('NARANJA')||/\bhigh\b/.test(cls)){level='FUERTE';badgeClass='warn'}
    else if(source.includes('AMARILLO')||/\bmedium\b/.test(cls)){level='MODERADA';badgeClass='warn'}
    else if(source.includes('VERDE')||/\blow\b/.test(cls)){level='BAJA';badgeClass='ok'}
    else return;
    first.querySelectorAll('.badge').forEach(b=>b.remove());
    const badge=d.createElement('span');badge.className='badge severity-badge '+badgeClass;badge.textContent=level;first.insertBefore(badge,first.firstChild);
    if(/\bhigh\b/.test(cls)||/\bmedium\b/.test(cls)){card.classList.remove('high');card.classList.add('medium')}
  });
}
function moveCalculatedAlertsToCurrent(){
  const d=getDoc();if(!d)return;const source=d.getElementById('systemAlerts'),target=d.getElementById('officialAlerts');if(!source||!target)return;
  const cards=[...source.querySelectorAll('.alert-card')];if(!cards.length)return;const marker='calculated-current-marker';
  if(!target.querySelector('.'+marker)){const label=d.createElement('div');label.className='label '+marker;label.style.marginTop='12px';label.textContent='⚠️ Riesgo calculado por Climate Alert';target.appendChild(label)}
  cards.forEach(card=>{const key=(card.textContent||'').trim();if(![...target.querySelectorAll('.alert-card')].some(x=>(x.textContent||'').trim()===key))target.appendChild(card)});source.innerHTML='';
}
let lastMeasurementCheck=0;
async function syncRecentMeasurements(){
  const d=getDoc();if(!d)return;
  const target=d.getElementById('officialAlerts');if(!target)return;
  const apiInput=d.getElementById('api');
  const base=(apiInput&&apiInput.value?apiInput.value:'').replace(/\/$/,'');
  if(!base||Date.now()-lastMeasurementCheck<15000)return;
  lastMeasurementCheck=Date.now();
  try{
    const response=await fetch(base+'/measurements',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    const items=Array.isArray(data.items)?data.items:[];
    d.querySelectorAll('.recent-measurement-alert').forEach(x=>x.remove());
    const recent=items.filter(item=>{const risk=String(item.risk_level||'').toUpperCase();const t=Date.parse(item.timestamp||'');if(!['ALTO','CRITICO'].includes(risk)||Number.isNaN(t))return false;const age=Date.now()-t;return age>=0&&age<=15*60*1000}).sort((a,b)=>Date.parse(b.timestamp)-Date.parse(a.timestamp));
    if(!recent.length)return;
    let label=target.querySelector('.recent-measurement-label');
    if(!label){label=d.createElement('div');label.className='label recent-measurement-label';label.style.marginTop='12px';label.textContent='⚠️ Riesgo calculado por medición reciente';target.appendChild(label)}
    recent.forEach(item=>{const card=d.createElement('div');const risk=String(item.risk_level).toUpperCase();const cls=risk==='CRITICO'?'critical':'medium';const level=risk==='CRITICO'?'EXTREMA':'FUERTE';const badge=risk==='CRITICO'?'danger':'warn';const when=new Date(item.timestamp).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'});card.className='alert-card recent-measurement-alert '+cls;card.dataset.measurementId=item.id||'';card.innerHTML='<div><span class="badge '+badge+'">'+level+'</span> <span class="alert-title">Riesgo calculado por medición registrada</span></div><div class="alert-meta">Estación: '+(item.station_id||'—')+' · Lluvia: '+Number(item.rain_mm_h||0).toFixed(1)+' mm/h · Caudal/nivel: '+Number(item.river_level_m||0).toFixed(1)+' · Registrada: '+when+' · Medición reciente (≤ 15 min)</div>';target.appendChild(card)});
  }catch(e){console.warn('No se pudieron consultar las mediciones recientes:',e)}
}
function fixNews(){
  const d=getDoc();if(!d)return;
  const box=d.getElementById('news');if(!box)return;
  const items=[...box.querySelectorAll('.news-item')];
  const climate=/(lluvia|lluvias|precipitaci[oó]n|inundaci[oó]n|inundaciones|desborde|huaico|huayco|tormenta|crecida|caudal|quebrada|deslizamiento|r[ií]o|senamhi|friaje|helada|granizo|nevadas?|cicl[oó]n|fen[oó]meno el ni[nñ]o|el ni[nñ]o costero|temperatura extrema|viento fuerte|vientos fuertes|oleaje)/i;
  const peru=/(per[uú]|lima|callao|piura|tumbes|lambayeque|la libertad|trujillo|chiclayo|ancash|[aá]ncash|hu[aá]nuco|pasco|jun[ií]n|ica|arequipa|moquegua|tacna|cusco|puno|ayacucho|apur[ií]mac|huancavelica|amazonas|cajamarca|san mart[ií]n|ucayali|madre de dios|loreto|senamhi|indeci|rpp|el comercio|la rep[uú]blica|andina|gesti[oó]n|per[uú]21)/i;
  const generic=/(pol[ií]tica|elecciones|congreso|partido pol[ií]tico|feij[oó]o|moedas|seguridad|habitaci[oó]n|deportes|entretenimiento|hor[oó]scopo|rusia|cient[ií]fica por un accidente|bater[ií]as en un laboratorio)/i;
  let kept=0;
  items.forEach(item=>{const text=(item.textContent||'').toLowerCase();const ok=climate.test(text)&&peru.test(text)&&!generic.test(text);if(!ok)item.remove();else kept++});
  const count=d.getElementById('newsCount');if(count)count.textContent=String(kept);
  if(!kept&&!/Reintentando noticias/i.test((d.getElementById('newsStatus')||{}).textContent||''))box.innerHTML='<div class="empty">No se encontraron noticias climáticas relevantes de Perú.</div>';
}
const NEWS_FALLBACKS={
  lluvia:'https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=900&q=80',
  inundacion:'https://images.unsplash.com/photo-1547683905-f686c993aae5?auto=format&fit=crop&w=900&q=80',
  huaico:'https://images.unsplash.com/photo-1547683905-f686c993aae5?auto=format&fit=crop&w=900&q=80',
  friaje:'https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80',
  viento:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80',
  default:'https://images.unsplash.com/photo-1501630834273-4b5604d2ee31?auto=format&fit=crop&w=900&q=80'
};
function newsImage(article){
  if(article.socialimage||article.image_url)return article.socialimage||article.image_url;
  const text=((article.title||'')+' '+(article.description||'')).toLowerCase();
  if(/huaico|huayco|inund|desborde|río|rio|caudal/.test(text))return NEWS_FALLBACKS.inundacion;
  if(/friaje|helada|nieve|nev/.test(text))return NEWS_FALLBACKS.friaje;
  if(/viento|oleaje|tormenta/.test(text))return NEWS_FALLBACKS.viento;
  if(/lluvia|precipit/.test(text))return NEWS_FALLBACKS.lluvia;
  return NEWS_FALLBACKS.default;
}
function newsSeverity(article){
  const s=String(article.severity||'').toUpperCase();
  if(s==='CRITICA')return ['EXTREMA','danger'];
  if(s==='ALTA')return ['FUERTE','warn'];
  if(s==='MEDIA')return ['MODERADA','warn'];
  return ['BAJA','ok'];
}
let lastNewsSignature='';
async function renderNewsWithImages(){
  const d=getDoc();if(!d)return;
  const box=d.getElementById('news');if(!box)return;
  const apiInput=d.getElementById('api');const base=(apiInput&&apiInput.value?apiInput.value:'https://climate-alert-platform-api.onrender.com').replace(/\/$/,'');
  try{
    const r=await fetch(base+'/news?q='+encodeURIComponent('Perú alerta climática lluvias inundaciones desbordes huaicos SENAMHI El Niño Costero'),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const articles=Array.isArray(data.articles)?data.articles:[];
    const climate=/(lluvia|lluvias|precipitaci[oó]n|inundaci[oó]n|inundaciones|desborde|huaico|huayco|tormenta|crecida|caudal|quebrada|deslizamiento|r[ií]o|senamhi|friaje|helada|granizo|nevadas?|cicl[oó]n|fen[oó]meno el ni[nñ]o|el ni[nñ]o costero|temperatura extrema|viento fuerte|vientos fuertes|oleaje)/i;
    const generic=/(pol[ií]tica|elecciones|congreso|partido pol[ií]tico|deportes|entretenimiento|hor[oó]scopo|rusia|informativa)/i;
    const valid=articles.filter(a=>climate.test((a.title||'')+' '+(a.description||''))&&!generic.test((a.title||'')+' '+(a.description||''))).slice(0,12);
    if(!valid.length){box.innerHTML='<div class="empty">No se encontraron noticias climáticas relevantes de Perú.</div>';return}
    const signature=valid.map(a=>String(a.url||a.title||'')).join('|');
    if(signature===lastNewsSignature && box.querySelector('.climate-news-image')){const count=d.getElementById('newsCount');if(count)count.textContent=String(valid.length);return}
    lastNewsSignature=signature;
    box.innerHTML=valid.map(a=>{const [level,cls]=newsSeverity(a);const img=newsImage(a);const date=a.published_at||a.seendate||'';const when=date?new Date(date).toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'}):'';return '<article class="news-item climate-news-image" style="display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start"><img src="'+img+'" alt="Imagen relacionada con '+(a.title||'noticia climática de Perú').replace(/"/g,'&quot;')+'" loading="lazy" referrerpolicy="no-referrer" style="width:110px;height:82px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#eef5f8" onerror="this.style.display=\'none\'"/><div class="news-body"><div><span class="news-level '+cls+'">'+level+'</span></div><a href="'+(a.url||'#')+'" target="_blank" rel="noopener">'+(a.title||'Noticia climática')+'</a><div class="news-source">'+(a.source||a.domain||'Fuente peruana')+(when?' · '+when:'')+'</div><div class="news-source">'+(a.description||'').slice(0,180)+'</div></div></article>'}).join('');
    const count=d.getElementById('newsCount');if(count)count.textContent=String(valid.length);
  }catch(e){console.warn('No se pudieron cargar las noticias con imágenes:',e);fixNews()}
}
let lastWeatherCheck=0;
async function enhanceLocationWeather(){
  const d=getDoc();if(!d)return;
  if(Date.now()-lastWeatherCheck<30000)return;lastWeatherCheck=Date.now();
  const latEl=d.getElementById('lat'),lonEl=d.getElementById('lon');
  const lat=Number(latEl&&latEl.value),lon=Number(lonEl&&lonEl.value);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
  let panel=d.getElementById('locationWeatherPanel');
  if(!panel){
    panel=d.createElement('section');panel.id='locationWeatherPanel';panel.className='card';panel.style.marginTop='16px';
    panel.innerHTML='<div class="card-head"><div><div class="card-title"><span>📍</span><div><h2>Condiciones de la ubicación</h2><div class="card-kicker">Temperatura, viento, humedad y precipitación</div></div></div></div><span class="status" id="locationWeatherStatus">Consultando…</span></div><div id="locationWeatherGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px"></div>';
    const summary=d.querySelector('.summary');if(summary&&summary.parentNode)summary.parentNode.insertBefore(panel,summary.nextSibling);else d.body.insertBefore(panel,d.body.firstChild);
  }
  try{
    const base=((d.getElementById('api')||{}).value||'https://climate-alert-platform-api.onrender.com').replace(/\/$/,'');
    const r=await fetch(base+'/weather?lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const c=data.current||{};
    const unit=(k,def='—')=>c[k]===undefined||c[k]===null?def:String(c[k]);
    const cells=[['🌡️','Temperatura',unit('temperature_2m')+' °C'],['💨','Viento',unit('wind_speed_10m')+' km/h'],['💧','Humedad',unit('relative_humidity_2m')+' %'],['🌧️','Precipitación',unit('precipitation')+' mm']];
    d.getElementById('locationWeatherGrid').innerHTML=cells.map(x=>'<div style="padding:13px;border:1px solid var(--line);border-radius:14px;background:#fbfdfe"><div style="font-size:18px">'+x[0]+'</div><div style="font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:6px">'+x[1]+'</div><div style="font-size:20px;font-weight:900;margin-top:3px">'+x[2]+'</div></div>').join('');
    const status=d.getElementById('locationWeatherStatus');if(status)status.textContent='📍 '+lat.toFixed(4)+', '+lon.toFixed(4);
  }catch(e){const status=d.getElementById('locationWeatherStatus');if(status)status.textContent='No disponible';}
}
function fix(){patchNewsFetch();fixHistory();normalizeSeverity();moveCalculatedAlertsToCurrent();syncRecentMeasurements();enhanceLocationWeather()}
const f=document.getElementById('app');
f.addEventListener('load',()=>{patchNewsFetch();fix();setTimeout(renderNewsWithImages,800);setInterval(fix,1000);setInterval(renderNewsWithImages,60000)});

function loadClimateMapLibrary(done){
  if(window.L){done();return}
  if(!document.getElementById('climate-leaflet-css')){
    const css=document.createElement('link');
    css.id='climate-leaflet-css';css.rel='stylesheet';
    css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
  }
  const existing=document.getElementById('climate-leaflet-js');
  if(existing){existing.addEventListener('load',done,{once:true});return}
  const script=document.createElement('script');
  script.id='climate-leaflet-js';script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload=done;script.onerror=()=>console.warn('No se pudo cargar Leaflet para el mapa climático.');
  document.head.appendChild(script);
}

function climateMapApiBase(w,d){
  const api=d.getElementById('api');
  return (api&&api.value?api.value:'https://climate-alert-platform-api.onrender.com').replace(/\/$/,'');
}

async function climateMapWeather(w,d,point){
  const base=climateMapApiBase(w,d);
  try{
    const response=await fetch(base+'/weather?lat='+encodeURIComponent(point.lat)+'&lon='+encodeURIComponent(point.lon),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    const c=data.current||{};
    return {temperature:c.temperature_2m,rain:c.rain,precipitation:c.precipitation,wind:c.wind_speed_10m,humidity:c.relative_humidity_2m};
  }catch(error){
    console.warn('No se pudo consultar el clima de '+point.name+':',error);
    return null;
  }
}

function climateMapPopup(point,weather,selected){
  const temp=weather&&Number.isFinite(Number(weather.temperature))?Number(weather.temperature).toFixed(1)+' °C':'—';
  const rain=weather&&Number.isFinite(Number(weather.rain))?Number(weather.rain).toFixed(1)+' mm':'—';
  const precipitation=weather&&Number.isFinite(Number(weather.precipitation))?Number(weather.precipitation).toFixed(1)+' mm':'—';
  const wind=weather&&Number.isFinite(Number(weather.wind))?Number(weather.wind).toFixed(1)+' km/h':'—';
  const humidity=weather&&Number.isFinite(Number(weather.humidity))?Number(weather.humidity).toFixed(0)+' %':'—';
  return '<div class="climate-popup"><strong>📍 '+point.name+(selected?' · ubicación seleccionada':'')+'</strong>'+
    '<div class="popup-row"><span class="popup-label">Temperatura</span><b>'+temp+'</b></div>'+
    '<div class="popup-row"><span class="popup-label">Lluvia</span><b>'+rain+'</b></div>'+
    '<div class="popup-row"><span class="popup-label">Precipitación</span><b>'+precipitation+'</b></div>'+
    '<div class="popup-row"><span class="popup-label">Viento</span><b>'+wind+'</b></div>'+
    '<div class="popup-row"><span class="popup-label">Humedad</span><b>'+humidity+'</b></div></div>';
}

async function initClimateMap(){
  const f=document.getElementById('app');
  let d=null,w=null;
  try{w=f&&f.contentWindow;d=f&&f.contentDocument}catch(e){return}
  if(!d||!w||d.getElementById('climateMapCard'))return;
  const summary=d.querySelector('.summary');
  if(!summary)return;

  loadClimateMapLibrary(async()=>{
    if(d.getElementById('climateMapCard')||!w.L)return;
    summary.insertAdjacentHTML('afterend',
      '<section class="card climate-map-card" id="climateMapCard">'+
        '<div class="climate-map-head">'+
          '<div><div class="climate-map-title"><span>🗺️</span><div><h2>Mapa meteorológico de Perú</h2><div class="card-kicker">Ubicación seleccionada y puntos meteorológicos de referencia</div></div></div></div>'+
          '<div class="climate-map-actions"><button class="climate-map-btn" id="climateMapCenter" type="button">📍 Centrar ubicación</button><button class="climate-map-btn" id="climateMapPeru" type="button">🇵🇪 Ver Perú</button></div>'+
        '</div>'+
        '<div id="climateMapStatus" class="climate-map-status" style="margin-top:12px">Cargando condiciones meteorológicas…</div>'+
        '<div id="climateMap"></div>'+ 
        '<div class="climate-map-note">Fuente meteorológica: Open-Meteo a través del backend de Climate Alert Platform. Haz clic en cualquier punto del mapa para consultar esa ubicación.</div>'+ 
      '</section>'
    );

    const map=w.L.map(d.getElementById('climateMap'),{zoomControl:true,scrollWheelZoom:true}).setView([-9.19,-75.02],5);
    w.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    w.__climateMap=map;
    w.__climateMapMarkers=[];
    const peruBounds=w.L.latLngBounds([[-18.5,-81.5],[0.5,-68.5]]);
    const status=d.getElementById('climateMapStatus');
    const latInput=d.getElementById('lat'),lonInput=d.getElementById('lon');
    let selectedMarker=null;

    function selectedPoint(){
      const lat=Number(latInput&&latInput.value),lon=Number(lonInput&&lonInput.value);
      if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
      return {name:'Ubicación seleccionada',lat,lon};
    }

    async function updateSelected(){
      const point=selectedPoint();if(!point)return;
      if(selectedMarker)map.removeLayer(selectedMarker);
      selectedMarker=w.L.marker([point.lat,point.lon]).addTo(map);
      selectedMarker.bindPopup('<div class="climate-popup"><strong>📍 Ubicación seleccionada</strong><div class="popup-row"><span class="popup-label">Latitud</span><b>'+point.lat.toFixed(4)+'</b></div><div class="popup-row"><span class="popup-label">Longitud</span><b>'+point.lon.toFixed(4)+'</b></div><div class="popup-row"><span class="popup-label">Estado</span><b>Cargando…</b></div></div>');
      const weather=await climateMapWeather(w,d,point);
      selectedMarker.setPopupContent(climateMapPopup(point,weather,true));
      if(status)status.textContent='Ubicación: '+point.lat.toFixed(4)+', '+point.lon.toFixed(4)+' · condiciones meteorológicas actualizadas';
    }

    await updateSelected();

    for(const point of CLIMATE_MAP_POINTS){
      const marker=w.L.circleMarker([point.lat,point.lon],{radius:7,weight:2,fillOpacity:.85});
      marker.bindPopup('<div class="climate-popup"><strong>📍 '+point.name+'</strong><div class="popup-row"><span class="popup-label">Estado</span><b>Cargando…</b></div></div>');
      marker.addTo(map);
      w.__climateMapMarkers.push(marker);
      climateMapWeather(w,d,point).then(weather=>marker.setPopupContent(climateMapPopup(point,weather,false)));
    }

    d.getElementById('climateMapCenter').onclick=()=>{const p=selectedPoint();if(p)map.setView([p.lat,p.lon],9)};
    d.getElementById('climateMapPeru').onclick=()=>map.fitBounds(peruBounds,{padding:[20,20]});

    map.on('click',async event=>{
      if(latInput)latInput.value=event.latlng.lat.toFixed(4);
      if(lonInput)lonInput.value=event.latlng.lng.toFixed(4);
      await updateSelected();
      if(typeof w.refreshAll==='function'){try{w.refreshAll()}catch(e){console.warn('No se pudo actualizar el dashboard tras seleccionar el mapa:',e)}}
    });

    setInterval(async()=>{
      if(!w.__climateMap)return;
      for(const markerPoint of CLIMATE_MAP_POINTS){
        const marker=w.__climateMapMarkers.find(m=>{const p=m.getLatLng();return Math.abs(p.lat-markerPoint.lat)<.001&&Math.abs(p.lng-markerPoint.lon)<.001});
        if(!marker)continue;
        const weather=await climateMapWeather(w,d,markerPoint);
        marker.setPopupContent(climateMapPopup(markerPoint,weather,false));
      }
      updateSelected();
    },60000);
  });
}

document.getElementById('app')?.addEventListener('load',()=>setTimeout(initClimateMap,1000));
setTimeout(initClimateMap,2500);

</script>
</body>
</html>
