<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Climate Alert Platform</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{display:block;width:100%;height:100%;border:0}
</style>

<body>
<iframe id="dashboardFrame" src="index-original.html?v=20261010-final" title="Climate Alert Platform"></iframe>
<script>
/*
 * Capa de presentación del proyecto.
 * La interfaz oculta las variables que el profesor pidió retirar y
 * concentra la consulta en temperatura, mapa, zonas prioritarias,
 * noticias y avisos oficiales.
 */
const frame=document.getElementById('dashboardFrame');
const CACHE='cap20261010_final_';
const API='https://climate-alert-platform-api.onrender.com';
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sev(v){const s=String(v||'').toUpperCase();if(s.includes('CRIT')||s.includes('ROJO'))return{c:'critical',l:'ROJO',n:4};if(s.includes('ALTA')||s.includes('NARANJA')||s.includes('HIGH'))return{c:'high',l:'NARANJA',n:3};if(s.includes('MEDIA')||s.includes('AMARILLO')||s.includes('MEDIUM'))return{c:'medium',l:'AMARILLO',n:2};return{c:'low',l:'VERDE',n:1}}
function dateOf(a){return a.start_at||a.start_date||a.start||a.date_start||a.date||a.issued_at||''}
function regionKey(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
const STATIONS={
  Lima:[-12.0464,-77.0428],Piura:[-5.1945,-80.6328],Tumbes:[-3.5708,-80.4590],Chiclayo:[-6.7714,-79.8409],Trujillo:[-8.1116,-79.0288],Ica:[-14.0678,-75.7286],Arequipa:[-16.4090,-71.5375],Cusco:[-13.5319,-71.9675],Iquitos:[-3.7437,-73.2516],Tarapoto:[-6.4850,-76.3600],Huancayo:[-12.0651,-75.2049],Tacna:[-18.0066,-70.2463]};
let selectedCity='Piura';
function injectStyles(){const d=doc();if(!d||!d.head||d.getElementById('finalFixStyles'))return;const s=d.createElement('style');s.id='finalFixStyles';s.textContent=`
#lat,#lon,#locBtn,.location-tag,.live-pill,.config,.hero-note,.hero-controls{display:none!important}
.summary{grid-template-columns:1fr 1fr!important}.summary .metric:nth-child(2),.summary .metric:nth-child(3){display:none!important}
#worstZonesPanel,#riskMapPanel{margin-top:18px}.zone-picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.zone-picker label{font-size:11px;font-weight:850;color:#426277}.zone-picker select{border:1px solid #d9e8ed;border-radius:12px;padding:9px 12px;background:#fff;color:#15334b;font-weight:750}
.worst-zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.worst-zone{position:relative;overflow:hidden;background:#fff;border:1px solid #dce8ee;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(19,64,88,.06)}.worst-zone:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#1b8d68}.worst-zone.high:before{background:#e07a00}.worst-zone.medium:before{background:#c19a00}.worst-zone.critical:before{background:#c53a43}.worst-zone-top{display:flex;justify-content:space-between;gap:8px}.worst-risk{font-size:10px;font-weight:900;padding:5px 9px;border-radius:999px}.worst-risk.critical{background:#ffe0e0;color:#a01818}.worst-risk.high{background:#ffe9cf;color:#9a4a00}.worst-risk.medium{background:#fff5cc;color:#785300}.worst-risk.low{background:#def6e8;color:#15723e}.worst-zone h3{margin:11px 0 5px;font-size:15px;color:#15334b}.worst-region{font-size:11px;color:#6d8090;margin-bottom:8px}.worst-desc{font-size:11px;line-height:1.45;color:#526b7b;min-height:32px}.worst-meta{display:flex;gap:6px;margin-top:11px}.worst-chip{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef5f8;color:#365b70}.worst-link{display:inline-block;margin-top:10px;color:#07516d;font-size:11px;font-weight:850}.worst-empty{padding:20px;border:1px dashed #d6e5eb;border-radius:15px;text-align:center;color:#6d8090;background:#f6fafb;font-size:12px}
#interactiveRiskMap{height:390px;border-radius:18px;overflow:hidden;border:1px solid #dce8ee;margin-top:14px}.map-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.map-tool{padding:7px 11px;border-radius:999px;background:#eef5f8;color:#24516d;border:1px solid #d9e8ed;font-size:11px;font-weight:800;cursor:pointer}.map-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:#526b7b;font-size:11px}.map-legend span{display:inline-flex;align-items:center;gap:5px}.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}.red{background:#c53a43}.orange{background:#e07a00}.yellow{background:#c19a00}.green{background:#1b8d68}
.news-item{align-items:stretch!important}.news-thumb,.news-placeholder{width:125px;height:82px;object-fit:cover;border-radius:12px;background:#eaf3f6;flex:none}.news-placeholder{display:grid;place-items:center;font-size:25px}.official-wrap{display:grid;gap:9px;margin-top:12px}.official-card{border:1px solid #dce8ee;border-left:5px solid #c19a00;border-radius:15px;padding:13px;background:#fff}.official-card.critical{border-left-color:#c53a43}.official-card.high{border-left-color:#e07a00}.official-card.medium{border-left-color:#c19a00}.official-card h3{margin:7px 0 4px;font-size:14px}.official-card p{margin:0;color:#526b7b;font-size:11px;line-height:1.4}.official-card a{display:inline-block;margin-top:7px;color:#07516d;font-size:11px;font-weight:850}
@media(max-width:900px){.worst-zones{grid-template-columns:1fr 1fr}.news-thumb,.news-placeholder{width:105px;height:72px}}@media(max-width:650px){.worst-zones{grid-template-columns:1fr}#interactiveRiskMap{height:320px}.news-thumb,.news-placeholder{width:90px;height:68px}}
`;d.head.appendChild(s);if(!d.getElementById('leafletCss')){const l=d.createElement('link');l.id='leafletCss';l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(l)}}
function ensureLeaflet(){const d=doc();if(!d)return Promise.reject(new Error('documento no disponible'));if(d.defaultView.L)return Promise.resolve(d.defaultView.L);return new Promise((resolve,reject)=>{let s=d.getElementById('leafletJs');if(!s){s=d.createElement('script');s.id='leafletJs';s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>resolve(d.defaultView.L);s.onerror=reject;d.head.appendChild(s)}else{s.onload=()=>resolve(d.defaultView.L);s.onerror=reject}})}
function ensurePanels(){const d=doc();if(!d||!d.body)return;const summary=d.querySelector('.summary');if(!summary)return;let picker=d.getElementById('zonePicker');if(!picker){picker=d.createElement('div');picker.id='zonePicker';picker.className='zone-picker';picker.innerHTML='<label>📍 Consultar temperatura por zona:</label><select id="zoneSelect"></select>';summary.insertAdjacentElement('afterend',picker)}const select=d.getElementById('zoneSelect');if(select&&!select.options.length){Object.keys(STATIONS).forEach(city=>{const o=d.createElement('option');o.value=city;o.textContent=city;select.appendChild(o)});select.value=selectedCity;select.onchange=()=>selectZone(select.value)}
let worst=d.getElementById('worstZonesPanel');if(!worst){worst=d.createElement('section');worst.id='worstZonesPanel';worst.className='card';worst.innerHTML='<div class="card-head"><div class="card-title"><span>🚨</span><div><h2>Zonas con peor estado</h2><div class="card-kicker">Prioridad según avisos oficiales vigentes de SENAMHI</div></div></div><div id="worstZonesStatus" class="status">Consultando alertas oficiales…</div></div><div id="worstZones" class="worst-zones"><div class="worst-empty">Consultando…</div></div>';picker.insertAdjacentElement('afterend',worst)}
let map=d.getElementById('riskMapPanel');if(!map){map=d.createElement('section');map.id='riskMapPanel';map.className='card';map.innerHTML='<div class="card-head"><div class="card-title"><span>🗺️</span><div><h2>Mapa interactivo de riesgo</h2><div class="card-kicker">Consulta las principales zonas del Perú</div></div></div><div id="riskMapStatus" class="status">Mapa listo para consultar</div></div><div id="interactiveRiskMap"></div><div class="map-tools"><button class="map-tool" id="mapPeruBtn">🇵🇪 Ver Perú</button><button class="map-tool" id="mapAlertsBtn">🚨 Centrar alertas</button></div><div class="map-legend"><span><i class="legend-dot red"></i>Rojo</span><span><i class="legend-dot orange"></i>Naranja</span><span><i class="legend-dot yellow"></i>Amarillo</span><span><i class="legend-dot green"></i>Sin alerta</span></div>';worst.insertAdjacentElement('afterend',map)}}
async function selectZone(city){selectedCity=city;const d=doc();const coords=STATIONS[city];if(!coords)return;const lat=d&&d.getElementById('lat'),lon=d&&d.getElementById('lon');if(lat)lat.value=coords[0];if(lon)lon.value=coords[1];try{const r=await fetch(API+'/weather?lat='+coords[0]+'&lon='+coords[1],{cache:'no-store'});const data=await r.json();const temp=data.current&&data.current.temperature_2m;if(d&&d.getElementById('temp'))d.getElementById('temp').textContent=(temp!=null?Number(temp).toFixed(1):'—')+' °C';if(d&&d.getElementById('status'))d.getElementById('status').textContent='Temperatura actual consultada para '+city;const tag=d&&d.getElementById('locationTag');if(tag)tag.textContent='📍 '+city}catch(e){console.warn('Temperatura:',e)}try{if(d&&typeof d.defaultView.refreshAll==='function')d.defaultView.refreshAll()}catch(e){}}
function setupTemperature(){const d=doc();if(!d)return;const s=d.getElementById('zoneSelect');if(s)s.value=selectedCity;selectZone(selectedCity)}
let map=null;let markers=[];
function alertForStation(city,alerts){const key=regionKey(city);return alerts.filter(a=>{const r=regionKey(a.region||a.regions||a.departments||a.department||'');return r&&r!=='peru'&&(r.includes(key)||key.includes(r))})}
async function renderMap(alerts){const d=doc();if(!d)return;const L=await ensureLeaflet();const box=d.getElementById('interactiveRiskMap');if(!box)return;if(!map){map=L.map(box,{scrollWheelZoom:true}).setView([-9.2,-75],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);d.getElementById('mapPeruBtn').onclick=()=>map.setView([-9.2,-75],5);d.getElementById('mapAlertsBtn').onclick=()=>{const active=markers.filter(x=>x.alert);if(active.length)map.fitBounds(L.featureGroup(active.map(x=>x.marker)).getBounds().pad(.25));else map.setView([-9.2,-75],5)}}markers.forEach(x=>x.marker.remove());markers=[];Object.entries(STATIONS).forEach(([city,coords])=>{const aa=alertForStation(city,alerts);const best=aa.map(a=>sev(a.level||a.severity||a.color)).sort((a,b)=>b.n-a.n)[0]||sev('');const color=best.c==='critical'?'#c53a43':best.c==='high'?'#e07a00':best.c==='medium'?'#c19a00':'#1b8d68';const m=L.circleMarker(coords,{radius:9,fillColor:color,color:'#fff',weight:2,fillOpacity:.9}).addTo(map);m.bindPopup('<strong>'+safe(city)+'</strong><br>Temperatura: consultar aquí<br>'+ (aa.length?(aa.length+' aviso(s) oficial(es)'):'Sin aviso oficial vigente'));m.on('click',()=>selectZone(city));markers.push({marker:m,alert:aa.length>0})});const st=d.getElementById('riskMapStatus');if(st)st.textContent='Mapa listo · '+Object.keys(STATIONS).length+' zonas consultables';setTimeout(()=>map.invalidateSize(),150)}
function renderWorst(alerts){const d=doc();const box=d&&d.getElementById('worstZones');const st=d&&d.getElementById('worstZonesStatus');if(!box)return;const current=alerts.filter(a=>String(a.status||'').toUpperCase()==='ACTUAL'||a.is_current===true||a.status==null);const top=current.map(a=>({a,s:sev(a.level||a.severity||a.color)})).sort((x,y)=>y.s.n-x.s.n).slice(0,6);if(!top.length){box.innerHTML='<div class="worst-empty">🟢 No hay alertas oficiales vigentes en este momento.</div>';if(st)st.textContent='Sin alertas vigentes';return}if(st)st.textContent=top.length+' zonas prioritarias';box.innerHTML=top.map(({a,s})=>'<article class="worst-zone '+s.c+'"><div class="worst-zone-top"><span class="worst-risk '+s.c+'">'+s.l+'</span><span style="font-size:10px;color:#6d8090">'+safe(dateOf(a))+'</span></div><h3>'+safe(a.title||a.name||a.alert_type||'Aviso meteorológico')+'</h3><div class="worst-region">📍 '+safe(a.region||a.regions||a.departments||'Perú')+'</div><div class="worst-desc">'+safe(a.description||a.message||'Aviso oficial vigente de SENAMHI.')+'</div><div class="worst-meta"><span class="worst-chip">SENAMHI</span><span class="worst-chip">'+safe(a.level||'AVISO')+'</span></div>'+(a.url?'<a class="worst-link" href="'+safe(a.url)+'" target="_blank" rel="noopener">Ver aviso oficial ↗</a>':'')+'</article>').join('')}
function renderOfficial(alerts,past){const d=doc();if(!d)return;const box=d.getElementById('officialAlerts'),pbox=d.getElementById('pastOfficialAlerts');function html(list,empty){return list.length?'<div class="official-wrap">'+list.slice(0,20).map(a=>{const s=sev(a.level||a.severity||a.color);return '<article class="official-card '+s.c+'"><span class="worst-risk '+s.c+'">'+s.l+'</span><h3>'+safe(a.title||a.name||a.alert_type||'Aviso meteorológico')+'</h3><p>📍 '+safe(a.region||a.regions||a.departments||'Perú')+' · '+safe(dateOf(a))+'</p>'+(a.url?'<a href="'+safe(a.url)+'" target="_blank" rel="noopener">Fuente oficial SENAMHI ↗</a>':'')+'</article>'}).join('')+'</div>':'<div class="empty">'+empty+'</div>'}if(box)box.innerHTML=html(alerts,'No hay avisos oficiales vigentes.');if(pbox)pbox.innerHTML=html(past,'No hay avisos oficiales pasados disponibles.')}
function imageOf(a){return a.image_url||a.socialimage||a.image||a.thumbnail||''}
function renderNews(list){const d=doc();const box=d&&d.getElementById('news');if(!box||!list.length)return;box.innerHTML=list.slice(0,10).map(a=>{const img=imageOf(a);const visual=img?'<img class="news-thumb" src="'+safe(img)+'" alt="Imagen de la noticia" loading="lazy" onerror="this.outerHTML=\'<div class=\"news-placeholder\">📰</div>\'>':'<div class="news-placeholder">📰</div>';return '<article class="news-item">'+visual+'<div class="news-body"><div><span class="news-level medium">CLIMA</span> <a href="'+safe(a.url||'#')+'" target="_blank" rel="noopener">'+safe(a.title||'Sin título')+'</a></div><div class="news-source">'+safe(a.domain||a.source||'Medio peruano')+' · '+safe(a.seendate||a.published_at||a.publishedAt||'')+'</div></div><span>↗</span></article>'}).join('');const count=d.getElementById('newsCount');if(count)count.textContent=Math.min(list.length,10);const status=d.getElementById('newsStatus');if(status)status.textContent='🟢 Noticias recientes de Perú'}
async function syncData(){try{const r=await fetch(API+'/official-alerts',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const current=Array.isArray(data.current_alerts)?data.current_alerts:[];const past=Array.isArray(data.past_alerts)?data.past_alerts:[];renderWorst(current);renderOfficial(current,past);renderMap(current)}catch(e){console.warn('Avisos SENAMHI:',e);const d=doc();if(d&&d.getElementById('worstZonesStatus'))d.getElementById('worstZonesStatus').textContent='No se pudo actualizar; revisa la fuente oficial'}try{const r=await fetch(API+'/news?country=PE&category=CLIMA',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const list=Array.isArray(data.articles)?data.articles:[];if(list.length){renderNews(list);localStorage.setItem(CACHE+'news',JSON.stringify(list))}else{const cached=JSON.parse(localStorage.getItem(CACHE+'news')||'[]');if(cached.length)renderNews(cached)}}catch(e){try{const cached=JSON.parse(localStorage.getItem(CACHE+'news')||'[]');if(cached.length)renderNews(cached)}catch(_){}}}
function apply(){const d=doc();if(!d||!d.body)return;injectStyles();ensurePanels();if(d.defaultView){d.defaultView.useCurrentLocation=function(){return false}}}
frame.addEventListener('load',()=>{setTimeout(()=>{apply();setupTemperature();syncData()},300);setTimeout(()=>{apply();syncData()},1500);setInterval(()=>{apply();syncData()},60000);try{const d=doc();if(d&&d.body)new MutationObserver(()=>apply()).observe(d.body,{childList:true,subtree:true})}catch(e){}});
</script>
</body>
</html>
