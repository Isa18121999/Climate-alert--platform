<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Climate Alert Platform</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="index-original.html" title="Climate Alert Platform"></iframe>
<script>
const HIST=[
['269','INCREMENTO DE VIENTO EN LA SIERRA NORTE','2026-07-07','2026-07-09','NARANJA'],
['268','INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA (EXTENSIÓN DEL AVISO 266)','2026-07-07','2026-07-09','NARANJA'],
['267','NEVADA EN LA SIERRA CENTRO Y SUR (EXTENSIÓN DEL AVISO 261)','2026-07-04','2026-07-04','AMARILLO'],
['266','INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA','2026-07-04','2026-07-06','NARANJA'],
['265','INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR','2026-07-05','2026-07-06','NARANJA'],
['264','DESCENSO DE TEMPERATURA DIURNA EN LA SELVA - QUINTO FRIAJE','2026-07-03','2026-07-04','NARANJA'],
['263','INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR','2026-07-03','2026-07-04','NARANJA'],
['262','LLUVIA EN LA SELVA - QUINTO FRIAJE','2026-07-02','2026-07-03','AMARILLO'],
['261','NEVADA EN LA SIERRA CENTRO Y SUR','2026-07-02','2026-07-03','NARANJA'],
['260','INCREMENTO DE VIENTO EN LA SIERRA','2026-07-01','2026-07-03','AMARILLO']
];
function fixHistory(){
  const f=document.getElementById('app');
  let d;try{d=f.contentDocument;if(!d||!d.getElementById('pastOfficialAlerts'))return}catch(e){return}
  const box=d.getElementById('pastOfficialAlerts');
  const title=d.getElementById('pastOfficialTitle');
  const status=d.getElementById('alertsStatus');
  const html=HIST.map(x=>{const orange=x[4]==='NARANJA';return '<div class="alert-card official '+(orange?'high':'medium')+'"><div><span class="badge '+(orange?'danger':'warn')+'">HISTÓRICO</span> <span class="alert-title">'+x[1]+'</span></div><div class="alert-meta">SENAMHI · N.º '+x[0]+' · Inicio: '+x[2]+' · Fin: '+x[3]+' · Aviso pasado</div><a class="alert-link" href="https://web2.senamhi.gob.pe/?p=avisos" target="_blank" rel="noopener">Ver aviso oficial</a></div>'}).join('');
  if(box && (!box.children.length || box.dataset.fixed!=='1')){box.innerHTML=html;box.dataset.fixed='1'}
  if(title)title.style.display='block';
  if(status && status.textContent==='Consultando alertas…')status.textContent='Histórico oficial disponible · SENAMHI';
}
const f=document.getElementById('app');
f.addEventListener('load',()=>{fixHistory();setInterval(fixHistory,1500)});
</script>
</body>
</html>
