<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>Climate Alert Platform</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dashboardFrame" src="index-original.html?v=20261010-profesor3" title="Climate Alert Platform"></iframe>
<script>
/*
 * Capa de presentación para las correcciones solicitadas por el profesor.
 * - Mantiene la pantalla enfocada en temperatura y zonas con peor estado.
 * - No usa la geolocalización del navegador.
 * - Añade un mapa interactivo de riesgo con avisos oficiales vigentes.
 * - Las noticias se muestran con su imagen cuando la fuente la proporciona.
 * - Conserva datos válidos cuando una fuente externa tarda en responder.
 */
const frame=document.getElementById('dashboardFrame');
const CACHE_PREFIX='cap20261010_';
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
function apiBase(){const d=doc();const el=d&&d.getElementById('api');return ((el&&el.value)||'https://climate-alert-platform-api.onrender.com').replace(/\/$/,'')}
function safeText(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sevInfo(v){const s=String(v||'').toUpperCase();if(s.includes('CRIT')||s.includes('ROJO'))return{key:'critical',label:'ROJO',score:4};if(s.includes('ALTA')||s.includes('NARANJA')||s.includes('HIGH'))return{key:'high',label:'NARANJA',score:3};if(s.includes('MEDIA')||s.includes('AMARILLO')||s.includes('MEDIUM'))return{key:'medium',label:'AMARILLO',score:2};return{key:'low',label:'VERDE',score:1}}
function alertDate(a){return a.start_at||a.start_date||a.start||a.date_start||a.date||''}
function injectStyles(){const d=doc();if(!d||!d.head||d.getElementById('teacherFixStyles'))return;const s=d.createElement('style');s.id='teacherFixStyles';s.textContent=`
#lat,#lon,#locBtn,.location-tag,.live-pill,.config,.hero-note{display:none!important}
.hero-controls{display:none!important}
.summary{grid-template-columns:1fr 1fr!important}
.summary .metric:nth-child(2),.summary .metric:nth-child(3){display:none!important}
#worstZonesPanel,#riskMapPanel{margin-top:18px}
.worst-zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.worst-zone{position:relative;overflow:hidden;background:#fff;border:1px solid #dce8ee;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(19,64,88,.06)}
.worst-zone:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#1b8d68}.worst-zone.high:before{background:#e07a00}.worst-zone.medium:before{background:#c19a00}.worst-zone.critical:before{background:#c53a43}
.worst-zone-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.worst-risk{font-size:10px;font-weight:900;letter-spacing:.04em;padding:5px 9px;border-radius:999px}
.worst-risk.critical{background:#ffe0e0;color:#a01818}.worst-risk.high{background:#ffe9cf;color:#9a4a00}.worst-risk.medium{background:#fff5cc;color:#785300}.worst-risk.low{background:#def6e8;color:#15723e}
.worst-zone h3{margin:11px 0 5px;font-size:15px;line-height:1.25;color:#15334b}.worst-region{font-size:11px;color:#6d8090;margin-bottom:8px}.worst-desc{font-size:11px;line-height:1.45;color:#526b7b;min-height:34px}
.worst-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.worst-chip{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef5f8;color:#365b70}.worst-link{display:inline-block;margin-top:11px;color:#07516d;font-size:11px;font-weight:850;text-decoration:none}.worst-link:hover{text-decoration:underline}
.worst-empty{padding:20px;border:1px dashed #d6e5eb;border-radius:15px;text-align:center;color:#6d8090;background:#f6fafb;font-size:12px}
#interactiveRiskMap{height:390px;border-radius:18px;overflow:hidden;border:1px solid #dce8ee;margin-top:14px;z-index:1}
.map-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.map-tool{padding:7px 11px;border-radius:999px;background:#eef5f8;color:#24516d;border:1px solid #d9e8ed;font-size:11px;font-weight:800;cursor:pointer}.map-tool:hover{background:#e2f0f4}
.map-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:#526b7b;font-size:11px}.map-legend span{display:inline-flex;align-items:center;gap:5px}.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}.legend-red{background:#c53a43}.legend-orange{background:#e07a00}.legend-yellow{background:#c19a00}.legend-green{background:#1b8d68}
.news-item{align-items:stretch!important}.news-thumb{width:125px;height:82px;object-fit:cover;border-radius:12px;background:#eaf3f6;flex:none}.news-image-placeholder{width:125px;height:82px;border-radius:12px;background:linear-gradient(135deg,#dceef2,#edf6f8);display:grid;place-items:center;font-size:25px;flex:none}
@media(max-width:900px){.worst-zones{grid-template-columns:1fr 1fr}.news-thumb,.news-image-placeholder{width:105px;height:72px}}@media(max-width:650px){.worst-zones{grid-template-columns:1fr}.worst-zone{padding:14px}#interactiveRiskMap{height:320px}.news-thumb,.news-image-placeholder{width:90px;height:68px}}
`;d.head.appendChild(s);if(!d.getElementById('leafletCss')){const l=d.createElement('link');l.id='leafletCss';l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(l)}}
function ensureLeaflet(){const d=doc();if(!d)return Promise.reject(new Error('documento no disponible'));if(d.defaultView.L)return Promise.resolve(d.defaultView.L);return new Promise((resolve,reject)=>{let script=d.getElementById('leafletJs');if(!script){script=d.createElement('script');script.id='leafletJs';script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=()=>resolve(d.defaultView.L);script.onerror=reject;d.head.appendChild(script)}else{script.addEventListener('load',()=>resolve(d.defaultView.L));script.addEventListener('error',reject)}})}
function ensureWorstPanel(){const d=doc();if(!d||!d.body)return null;let panel=d.getElementById('worstZonesPanel');if(panel)return panel;const summary=d.querySelector('.summary');if(!summary)return null;panel=d.createElement('section');panel.id='worstZonesPanel';panel.className='card';panel.innerHTML=`<div class="card-head"><div><div class="card-title"><span>🚨</span><div><h2>Zonas con peor estado</h2><div class="card-kicker">Prioridad de atención según avisos oficiales vigentes de SENAMHI</div></div></div></div><div id="worstZonesStatus" class="status">Consultando alertas oficiales…</div></div><div id="worstZones" class="worst-zones"><div class="worst-empty">Consultando las zonas con mayor riesgo…</div></div>`;summary.insertAdjacentElement('afterend',panel);return panel}
function ensureMapPanel(){const d=doc();if(!d||!d.body)return null;let panel=d.getElementById('riskMapPanel');if(panel)return panel;const worst=d.getElementById('worstZonesPanel');if(!worst)return null;panel=d.createElement('section');panel.id='riskMapPanel';panel.className='card';panel.innerHTML=`<div class="card-head"><div><div class="card-title"><span>🗺️</span><div><h2>Mapa interactivo de riesgo</h2><div class="card-kicker">Zonas con avisos oficiales vigentes de SENAMHI</div></div></div></div><div id="riskMapStatus" class="status">Mapa listo para consultar</div></div><div id="interactiveRiskMap"></div><div class="map-tools"><button class="map-tool" id="mapPeruBtn">🇵🇪 Ver Perú</button><button class="map-tool" id="mapAlertsBtn">🚨 Centrar alertas</button></div><div class="map-legend"><span><i class="legend-dot legend-red"></i>Rojo</span><span><i class="legend-dot legend-orange"></i>Naranja</span><span><i class="legend-dot legend-yellow"></i>Amarillo</span><span><i class="legend-dot legend-green"></i>Sin alerta</span></div>`;worst.insertAdjacentElement('afterend',panel);return panel}
const REGION_COORDS={tumbes:[-3.57,-80.45],piura:[-5.20,-80.63],lambayeque:[-6.77,-79.84],"la libertad":[-8.11,-79.03],ancash:[-9.53,-77.53],lima:[-12.05,-77.04],ica:[-14.07,-75.73],arequipa:[-16.40,-71.54],moquegua:[-17.19,-70.94],tacna:[-18.01,-70.25],cusco:[-13.53,-71.97],puno:[-15.84,-70.02],junin:[-11.52,-75.94],cajamarca:[-7.16,-78.51],amazonas:[-6.23,-77.87],"san martin":[-6.49,-76.36],ucayali:[-8.38,-74.55],"madre de dios":[-12.59,-69.19],huanuco:[-9.93,-76.24],ayacucho:[-13.16,-74.22],huancavelica:[-12.79,-74.97],apurimac:[-13.64,-72.88],pasco:[-10.68,-76.26],"loreto":[-3.75,-73.25]};
function regionKey(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
let riskMap=null;let riskMarkers=[];
async function renderRiskMap(items){const panel=ensureMapPanel();if(!panel)return;try{const L=await ensureLeaflet();const d=doc();const box=d.getElementById('interactiveRiskMap');if(!box)return;if(!riskMap){riskMap=L.map(box,{scrollWheelZoom:true}).setView([-9.2,-75.0],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(riskMap);riskMap.invalidateSize();d.getElementById('mapPeruBtn').onclick=()=>riskMap.setView([-9.2,-75.0],5);d.getElementById('mapAlertsBtn').onclick=()=>{if(riskMarkers.length)riskMap.fitBounds(L.featureGroup(riskMarkers).getBounds().pad(0.25));else riskMap.setView([-9.2,-75.0],5)}}riskMarkers.forEach(m=>m.remove());riskMarkers=[];const current=(Array.isArray(items)?items:[]).filter(a=>String(a.status||'').toUpperCase()==='ACTUAL'||a.is_current===true||a.status==null);const groups=new Map();current.forEach(a=>{const raw=a.region||a.regions||a.departments||a.department||'';const parts=String(raw).split(/[,;|]/).map(regionKey).filter(Boolean);(parts.length?parts:['peru']).forEach(k=>{if(!groups.has(k))groups.set(k,[]);groups.get(k).push(a)})});groups.forEach((alerts,key)=>{let coord=REGION_COORDS[key];if(!coord){const found=Object.keys(REGION_COORDS).find(k=>key.includes(k)||k.includes(key));if(found)coord=REGION_COORDS[found]}if(!coord)coord=[-9.2,-75.0];const best=alerts.map(a=>sevInfo(a.severity||a.level||a.color)).sort((a,b)=>b.score-a.score)[0]||sevInfo('');const color=best.key==='critical'?'#c53a43':best.key==='high'?'#e07a00':best.key==='medium'?'#c19a00':'#1b8d68';const marker=L.circleMarker(coord,{radius:10,fillColor:color,color:'#fff',weight:2,fillOpacity:.9});marker.bindPopup('<strong>'+safeText(key==='peru'?'Perú':key.toUpperCase())+'</strong><br>'+alerts.length+' aviso(s) oficial(es) vigente(s)<br><small>SENAMHI</small>');marker.addTo(riskMap);riskMarkers.push(marker)});const st=d.getElementById('riskMapStatus');if(st)st.textContent=current.length?`${groups.size} zona${groups.size===1?'':'s'} con avisos vigentes`:'Sin avisos oficiales vigentes';setTimeout(()=>riskMap.invalidateSize(),100)}catch(e){const d=doc();const st=d&&d.getElementById('riskMapStatus');if(st)st.textContent='Mapa no disponible temporalmente';console.warn('No se pudo cargar el mapa:',e)}}
function renderWorstZones(items){const d=doc();const box=d&&d.getElementById('worstZones');const status=d&&d.getElementById('worstZonesStatus');if(!box)return;const current=(Array.isArray(items)?items:[]).filter(a=>String(a.status||'').toUpperCase()==='ACTUAL'||a.is_current===true||a.status==null);const ranked=current.map(a=>{const sev=sevInfo(a.severity||a.level||a.color);return{a,sev}}).sort((x,y)=>y.sev.score-x.sev.score);const top=ranked.slice(0,6);if(status)status.textContent=top.length?`${top.length} zona${top.length===1?'':'s'} prioritaria${top.length===1?'':'s'}`:'Sin alertas vigentes';if(!top.length){box.innerHTML='<div class="worst-empty">🟢 No hay zonas con alertas oficiales vigentes en este momento.</div>';localStorage.setItem(CACHE_PREFIX+'worst',box.innerHTML);return}box.innerHTML=top.map(({a,sev})=>{const title=safeText(a.title||a.name||a.alert_type||'Aviso meteorológico');const region=safeText(a.region||a.regions||a.departments||'Perú');const desc=safeText(a.description||a.message||'');const date=safeText(alertDate(a));const link=a.url?`<a class="worst-link" href="${safeText(a.url)}" target="_blank" rel="noopener noreferrer">Ver aviso oficial ↗</a>`:'';return `<article class="worst-zone ${sev.key}"><div class="worst-zone-top"><span class="worst-risk ${sev.key}">${sev.label} · RIESGO ${sev.score>=3?'ALTO':'MEDIO'}</span><span style="font-size:11px;color:#6d8090">${date}</span></div><h3>${title}</h3><div class="worst-region">📍 ${region}</div><div class="worst-desc">${desc||'Aviso oficial vigente de SENAMHI para la zona indicada.'}</div><div class="worst-meta"><span class="worst-chip">SENAMHI</span></div>${link}</article>`}).join('');localStorage.setItem(CACHE_PREFIX+'worst',box.innerHTML)}
async function syncWorstZones(){try{const r=await fetch(apiBase()+'/official-alerts',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const current=Array.isArray(data.current_alerts)?data.current_alerts:(Array.isArray(data.alerts)?data.alerts:[]);renderWorstZones(current);renderRiskMap(current)}catch(e){const d=doc();const box=d&&d.getElementById('worstZones');const status=d&&d.getElementById('worstZonesStatus');const cached=localStorage.getItem(CACHE_PREFIX+'worst');if(box&&cached)box.innerHTML=cached;if(status)status.textContent='Mostrando último estado válido';console.warn('No se pudo actualizar zonas prioritarias:',e)}}
function newsImage(a){return a.image_url||a.socialimage||a.image||a.thumbnail||''}
function renderNewsWithImages(articles){const d=doc();const box=d&&d.getElementById('news');if(!box)return;const list=(Array.isArray(articles)?articles:[]).slice(0,10);if(!list.length)return;box.innerHTML=list.map(a=>{const title=safeText(a.title||'Sin título');const url=safeText(a.url||'#');const source=safeText(a.domain||a.source||'Fuente peruana');const date=safeText(a.seendate||a.published_at||a.publishedAt||'');const sev=sevInfo(a.severity||'');const img=newsImage(a);const visual=img?`<img class="news-thumb" src="${safeText(img)}" alt="Imagen de ${title}" loading="lazy" onerror="this.outerHTML='<div class=\'news-image-placeholder\'>📰</div>'">`:'<div class="news-image-placeholder">📰</div>';return `<article class="news-item">${visual}<div class="news-body"><div><span class="news-level ${sev.key}">${safeText(a.severity||'CLIMA')}</span> <a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a></div><div class="news-source">${source} · ${date}</div></div><span style="font-size:14px">↗</span></article>`}).join('')}
async function syncNewsWithImages(){try{const r=await fetch(apiBase()+'/news?country=PE&category=CLIMA',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const list=Array.isArray(data)?data:(Array.isArray(data.articles)?data.articles:[]);if(list.length){renderNewsWithImages(list);localStorage.setItem(CACHE_PREFIX+'newsImages',JSON.stringify(list.slice(0,10)))}}catch(e){try{const cached=JSON.parse(localStorage.getItem(CACHE_PREFIX+'newsImages')||'[]');if(cached.length)renderNewsWithImages(cached)}catch(_){}}}
function stabilize(){const d=doc();if(!d)return;[['rows'],['officialAlerts'],['pastOfficialAlerts'],['systemAlerts']].forEach(([id])=>{const el=d.getElementById(id);if(!el)return;const has=el.children&&Array.from(el.children).some(x=>!(/no hay|sin avisos|aún no hay|no se pudieron|conecta la api/i.test((x.textContent||'').trim())));const key=CACHE_PREFIX+id;if(has)localStorage.setItem(key,el.innerHTML);else{const cached=localStorage.getItem(key);if(cached)el.innerHTML=cached}})}
function applyFixes(){const d=doc();if(!d||!d.body)return;injectStyles();ensureWorstPanel();ensureMapPanel();const lat=d.getElementById('lat'),lon=d.getElementById('lon'),loc=d.getElementById('locBtn');[lat,lon,loc].forEach(el=>{if(el)el.setAttribute('aria-hidden','true')});if(d.defaultView){d.defaultView.useCurrentLocation=function(){const tag=d.getElementById('locationTag');if(tag)tag.textContent='';return false}}stabilize()}
frame.addEventListener('load',()=>{setTimeout(()=>{applyFixes();syncWorstZones();syncNewsWithImages()},250);setTimeout(()=>{applyFixes();syncWorstZones();syncNewsWithImages()},1200);setInterval(()=>{applyFixes();syncWorstZones();syncNewsWithImages();stabilize()},60000);try{const d=doc();if(d&&d.body)new MutationObserver(()=>applyFixes()).observe(d.body,{childList:true,subtree:true})}catch(e){}});
</script>
</body>
</html>
