<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Climate Alert Platform</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f8}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="index-original.html?v=20261005-current-risk4" title="Climate Alert Platform"></iframe>
<script>
const HIST=[
['269','INCREMENTO DE VIENTO EN LA SIERRA NORTE','2026-07-07','2026-07-09','NARANJA'],
['268','INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA (EXTENSIÓN DEL AVISO 266)','2026-07-07','2026-07-09','NARANJA'],
['267','NEVADA EN LA SIERRA CENTRO Y SUR (EXTENSIÓN DEL AVISO 261)','2026-07-04','2026-07-04','AMARILLO'],
['266','INCREMENTO DE TEMPERATURA DIURNA EN LA COSTA Y SIERRA','2026-07-04','2026-07-06','NARANJA'],
['265','INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR','2026-07-05','2026-07-06','NARANJA'],
['264','DESCENSO DE TEMPERATURA DIURNA EN LA SELVA - QUINTO FRIAJE','2026-07-03','2026-07-04','NARANJA'],
['263','INCREMENTO DE VIENTO EN LA COSTA CENTRO Y SUR','2026-07-03','2026-07-04','NARANJA'],
['262','LLUVIA EN LA SELVA - QUINTO FRIAJE','2026-07-02','2026-07-03','AMARILLO'],
['261','NEVADA EN LA SIERRA CENTRO Y SUR','2026-07-02','2026-07-03','NARANJA'],
['260','INCREMENTO DE VIENTO EN LA SIERRA','2026-07-01','2026-07-03','AMARILLO']
];
function getDoc(){const f=document.getElementById('app');try{return f.contentDocument||f.contentWindow.document}catch(e){return null}}
function fixHistory(){
  const d=getDoc();if(!d)return;
  const box=d.getElementById('pastOfficialAlerts');if(!box)return;
  const title=d.getElementById('pastOfficialTitle');
  const html=HIST.map(x=>{const extrema=x[4]==='ROJO';const cls=extrema?'critical':'medium';const badge=extrema?'danger':'warn';const level=extrema?'EXTREMA':x[4]==='NARANJA'?'FUERTE':'MODERADA';return '<div class="alert-card official '+cls+'"><div><span class="badge '+badge+'">'+level+'</span> <span class="alert-title">'+x[1]+'</span></div><div class="alert-meta">SENAMHI · N.º '+x[0]+' · Inicio: '+x[2]+' · Fin: '+x[3]+' · Aviso pasado</div><a class="alert-link" href="https://web2.senamhi.gob.pe/?p=avisos" target="_blank" rel="noopener">Ver aviso oficial</a></div>'}).join('');
  const empty=box.children.length===0||box.querySelector('.empty')||/No hay avisos oficiales pasados disponibles/i.test(box.textContent||'');
  if(empty){box.innerHTML=html;box.dataset.fixed='1'}
  if(title)title.style.display='block';
}
function normalizeSeverity(){
  const d=getDoc();if(!d)return;
  d.querySelectorAll('.alert-card').forEach(card=>{
    const cls=card.className||'';const first=card.querySelector('div');if(!first)return;
    const existing=first.querySelector('.badge:not(.severity-badge)');
    const source=((existing&&existing.textContent)||'').trim().toUpperCase();
    let level=null,badgeClass=null;
    if(source.includes('ROJO')||source.includes('CRITIC')||/\bcritical\b/.test(cls)){level='EXTREMA';badgeClass='danger'}
    else if(source.includes('NARANJA')||source.includes('ALTA')||/\bhigh\b/.test(cls)){level='FUERTE';badgeClass='warn'}
    else if(source.includes('AMARILLO')||source.includes('MEDIA')||/\bmedium\b/.test(cls)){level='MODERADA';badgeClass='warn'}
    else if(source.includes('VERDE')||source.includes('BAJA')||/\blow\b/.test(cls)){level='BAJA';badgeClass='ok'}
    if(!level)return;
    first.querySelectorAll('.badge').forEach(b=>b.remove());
    const badge=d.createElement('span');badge.className='badge severity-badge '+badgeClass;badge.textContent=level;first.insertBefore(badge,first.firstChild);
    if(/\bhigh\b/.test(cls)||/\bmedium\b/.test(cls)){card.classList.remove('high');card.classList.add('medium')}
  });
  d.querySelectorAll('.news-level').forEach(b=>{
    const t=(b.textContent||'').trim().toUpperCase();
    if(t==='CRÍTICA'||t==='CRITICA'||t==='CRITICO')b.textContent='EXTREMA';
    else if(t==='ALTA'||t==='ALTO')b.textContent='FUERTE';
    else if(t==='MEDIA'||t==='MEDIO')b.textContent='MODERADA';
    else if(t==='BAJA'||t==='BAJO')b.textContent='BAJA';
  });
  d.querySelectorAll('td').forEach(td=>{
    const t=(td.textContent||'').trim().toUpperCase();
    if(['CRITICO','CRÍTICO','ALTO','MEDIO','BAJO'].includes(t))td.textContent=t==='CRITICO'||t==='CRÍTICO'?'EXTREMA':t==='ALTO'?'FUERTE':t==='MEDIO'?'MODERADA':'BAJA';
  });
}
function currentTarget(){const d=getDoc();return d&&d.getElementById('officialAlerts')}
function addCurrentCard(card,key){const target=currentTarget();if(!target||!card)return;if(![...target.querySelectorAll('.alert-card')].some(x=>x.dataset.alertKey===key)){card.dataset.alertKey=key;target.appendChild(card)}}
function ensureCurrentMarker(){const d=getDoc(),target=currentTarget();if(!d||!target)return null;let marker=target.querySelector('.calculated-current-marker');if(!marker){marker=d.createElement('div');marker.className='label calculated-current-marker';marker.style.marginTop='12px';marker.textContent='⚠️ Riesgo calculado por Climate Alert';target.appendChild(marker)}return marker}
function moveCalculatedAlertsToCurrent(){const d=getDoc();if(!d)return;const source=d.getElementById('systemAlerts');const target=d.getElementById('officialAlerts');if(!source||!target)return;const cards=[...source.querySelectorAll('.alert-card')];if(!cards.length)return;ensureCurrentMarker();cards.forEach(card=>addCurrentCard(card,'generated-'+(card.textContent||'').trim()));source.innerHTML=''}
async function moveRecentCriticalMeasurementsToCurrent(){
  const d=getDoc();if(!d)return;const apiInput=d.getElementById('api');const base=(apiInput&&apiInput.value||'').replace(/\/$/,'');if(!base)return;
  try{const r=await fetch(base+'/measurements',{cache:'no-store'});if(!r.ok)return;const data=await r.json();const items=Array.isArray(data.items)?data.items:[];const now=Date.now();
    const recent=items.filter(x=>{const level=String(x.risk_level||'').toUpperCase();const ts=Date.parse(String(x.timestamp||'').replace(' ','T'));return(level==='ALTO'||level==='CRITICO')&&Number.isFinite(ts)&&(now-ts)>=-60000&&(now-ts)<=15*60*1000}).slice(0,3);
    if(!recent.length)return;ensureCurrentMarker();recent.forEach(x=>{const d2=getDoc();const level=String(x.risk_level||'').toUpperCase();const extreme=level==='CRITICO';const card=d2.createElement('div');card.className='alert-card '+(extreme?'critical':'high');const rain=Number(x.rain_mm_h);const river=Number(x.river_level_m);const rainText=Number.isFinite(rain)?rain+' mm/h':'—';const riverText=Number.isFinite(river)?river:'—';const when=new Date(String(x.timestamp||'').replace(' ','T')).toLocaleString('es-PE');card.innerHTML='<div><span class="badge '+(extreme?'danger':'warn')+'">'+(extreme?'EXTREMA':'FUERTE')+'</span> <span class="alert-title">Riesgo calculado por Climate Alert</span></div><div class="alert-meta">Estación '+(x.station_id||'—')+' · Lluvia: '+rainText+' · Caudal / nivel: '+riverText+' · '+when+' · Medición reciente</div>';addCurrentCard(card,'measurement-'+(x.id||x.timestamp||x.station_id))});
  }catch(e){console.warn('No se pudieron revisar mediciones recientes:',e)}
}
function syncOfficialCounter(){
  const d=getDoc();if(!d)return;const status=d.getElementById('alertsStatus');if(!status)return;
  const current=d.getElementById('officialAlerts');const past=d.getElementById('pastOfficialAlerts');
  const currentCount=current?[...current.querySelectorAll('.alert-card')].length:0;
  const pastCount=past?[...past.querySelectorAll('.alert-card')].length:0;
  status.textContent='SENAMHI: '+currentCount+' vigentes · '+pastCount+' pasados';
}
function fix(){fixHistory();normalizeSeverity();moveCalculatedAlertsToCurrent();moveRecentCriticalMeasurementsToCurrent();setTimeout(syncOfficialCounter,100)}
const f=document.getElementById('app');f.addEventListener('load',()=>{fix();setInterval(fix,5000)});
</script>
</body>
</html>
