<div id="projectCover" class="project-cover" role="dialog" aria-label="Portada del proyecto"><div class="project-cover-inner"><div class="project-cover-badge">🇵🇪 PERÚ · SISTEMA DE ALERTA TEMPRANA</div><h1>Plataforma de Alerta Temprana</h1><p>Monitoreo de lluvias extremas, inundaciones, desbordes, huaicos y otros eventos climáticos en el Perú.</p><div class="project-cover-actions"><button class="project-cover-btn" id="enterDashboard">Explorar plataforma</button><button class="project-cover-btn secondary" id="coverAlerts">Ver alertas</button></div><small>SENAMHI · noticias climáticas peruanas · mapa nacional de eventos</small></div></div>

<script>
const frame=document.getElementById('dashboardFrame'),API='https://climate-alert-platform-api.onrender.com';
const PERU=[['Tumbes',-3.57,-80.46],['Piura',-5.19,-80.63],['Lambayeque',-6.77,-79.84],['Cajamarca',-7.16,-78.51],['Amazonas',-6.23,-77.87],['Loreto',-3.75,-73.25],['San Martín',-6.49,-76.37],['La Libertad',-8.11,-79.03],['Áncash',-9.53,-77.53],['Huánuco',-9.93,-76.24],['Pasco',-10.68,-76.26],['Junín',-11.52,-75.93],['Lima',-12.05,-77.04],['Callao',-12.06,-77.14],['Ica',-14.07,-75.73],['Huancavelica',-12.79,-74.97],['Ayacucho',-13.16,-74.22],['Apurímac',-13.63,-72.88],['Cusco',-13.53,-71.97],['Madre de Dios',-12.59,-69.19],['Arequipa',-16.41,-71.54],['Moquegua',-17.19,-70.94],['Tacna',-18.01,-70.25],['Puno',-15.84,-70.02],['Ucayali',-8.38,-74.55]];
let map=null,markers=[],leafletPromise=null,newsCache=[],officialCache=[];
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function text(a){return((a.title||a.name||'')+' '+(a.description||a.message||'')).toLowerCase()}
function severity(a){const s=String(a.level||a.severity||a.color||'').toUpperCase(),t=text(a);if(s.includes('ROJO')||s.includes('CRIT')||/desborde|inundaci[oó]n|huaico|huayco|evacuaci[oó]n|emergencia/.test(t))return['ROJO','critical'];if(s.includes('NARANJA')||s.includes('ALTA')||/lluvias intensas|precipitaciones intensas|tormenta|caudal|crecida|deslizamiento|cicl[oó]n/.test(t))return['NARANJA','high'];return['AMARILLO','medium']}
function regionOf(a){return String(a.region||a.regions||a.departments||a.department||a.province||a.location||'').trim()}
function dateOf(a){return a.start_at||a.start_date||a.start||a.date_start||a.date||a.issued_at||a.published_at||''}
function current(a){const s=String(a.status||'').toUpperCase();return a.is_current===true||s==='ACTUAL'||s==='CURRENT'||(!s&&!a.end_date)}
function sourceOf(a){if(a.source)return a.source;try{return new URL(a.url).hostname.replace(/^www\./,'')}catch(e){return'Fuente oficial'}}
function newsImage(a){return a.socialimage||a.image_url||a.image||a.thumbnail||a.enclosure_url||''}
function isNewsRelevant(a){return/lluvia|lluvias|precipitaci[oó]n|inundaci[oó]n|desborde|huaico|huayco|tormenta|caudal|quebrada|deslizamiento|r[ií]o|senamhi|cicl[oó]n|oleaje|friaje|helada|granizo|viento|temperatura extrema/.test(text(a))}
function regionMatch(a,name){const t=(' '+text(a)+' '+regionOf(a).toLowerCase()).normalize('NFD').replace(/[\u0300-\u036f]/g,'');const n=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return t.includes(n)}
function injectStyles(){const d=doc();if(!d||!d.head||d.getElementById('capVisualStyles'))return;const s=d.createElement('style');s.id='capVisualStyles';s.textContent=`
.summary{display:none!important}.hero-controls,.config{display:none!important}.cap-cover-note{margin-top:12px;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.9);font-size:12px}#capVisual{margin-top:16px}.cap-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.cap-stat{background:#fff;border:1px solid #dce8ee;border-radius:18px;padding:15px;box-shadow:0 8px 24px rgba(19,64,88,.06)}.cap-stat b{display:block;font-size:24px;color:#15334b}.cap-stat span{font-size:11px;color:#6d8090}.cap-card{background:rgba(255,255,255,.96);border:1px solid #d7e4eb;border-radius:22px;padding:20px;box-shadow:0 16px 40px rgba(19,64,88,.08);margin-bottom:16px}.cap-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.cap-title{display:flex;gap:10px;align-items:flex-start}.cap-title h2{margin:0;font-size:19px;color:#15334b}.cap-sub{margin-top:4px;font-size:11px;color:#6d8090}.cap-status{padding:9px 12px;border-radius:12px;background:#f0f8fa;color:#426277;font-size:11px;font-weight:800}.cap-zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.cap-zone{position:relative;padding:15px;border:1px solid #dce8ee;border-radius:16px;background:#fff;overflow:hidden}.cap-zone:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#c19a00}.cap-zone.high:before{background:#e07a00}.cap-zone.critical:before{background:#c53a43}.cap-zone h3{margin:9px 0 4px;font-size:14px;color:#15334b}.cap-zone p{margin:0;font-size:11px;line-height:1.45;color:#526b7b}.cap-badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.cap-badge.critical{background:#ffe0e0;color:#a01818}.cap-badge.high{background:#ffe9cf;color:#9a4a00}.cap-badge.medium{background:#fff5cc;color:#785300}.cap-meta{margin-top:9px;font-size:10px;color:#6d8090}.cap-empty{padding:20px;border:1px dashed #d6e5eb;border-radius:15px;text-align:center;background:#f6fafb;color:#6d8090;font-size:12px}#capMap{height:430px;margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid #dce8ee}.cap-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11px;color:#526b7b}.cap-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.cap-red{background:#c53a43}.cap-orange{background:#e07a00}.cap-yellow{background:#c19a00}.cap-green{background:#1b8d68}.cap-news{display:grid;gap:11px;margin-top:14px}.cap-news-item{display:flex;gap:13px;padding:12px;border:1px solid #dce8ee;border-radius:16px;background:#fbfdfe}.cap-news-img,.cap-news-placeholder{width:145px;height:92px;object-fit:cover;border-radius:12px;background:#eaf3f6;flex:none}.cap-news-placeholder{background:linear-gradient(135deg,#dceff2,#edf6f7);display:grid;place-items:center;font-size:29px}.cap-news-body{min-width:0;flex:1}.cap-news-body a{color:#07516d;text-decoration:none;font-weight:850;font-size:13px;line-height:1.35}.cap-news-body a:hover{text-decoration:underline}.cap-news-source{margin-top:6px;color:#6d8090;font-size:10px}.cap-news-desc{margin-top:5px;color:#526b7b;font-size:11px;line-height:1.4}.cap-news-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.cap-tag{padding:4px 7px;border-radius:999px;background:#eef5f8;color:#365b70;font-size:9px;font-weight:850}@media(max-width:900px){.cap-zones{grid-template-columns:1fr 1fr}.cap-stats{grid-template-columns:1fr 1fr}.cap-news-img,.cap-news-placeholder{width:115px;height:78px}}@media(max-width:650px){.cap-card{padding:16px;border-radius:18px}.cap-zones,.cap-stats{grid-template-columns:1fr}.cap-head{flex-direction:column}.cap-status{align-self:stretch}.cap-news-item{padding:10px}.cap-news-img,.cap-news-placeholder{width:92px;height:70px}.cap-news-desc{display:none}#capMap{height:330px}}
`;d.head.appendChild(s);if(!d.getElementById('leafletCss')){const l=d.createElement('link');l.id='leafletCss';l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';d.head.appendChild(l)}const hero=d.querySelector('.hero');if(hero&&!d.getElementById('capCoverNote')){const n=d.createElement('div');n.id='capCoverNote';n.className='cap-cover-note';n.textContent='🇵🇪 Monitoreo nacional del Perú · avisos SENAMHI · eventos y noticias climáticas · mapa de puntos de riesgo';hero.appendChild(n)}}
function ensureUI(){const d=doc();if(!d||!d.body)return;let root=d.getElementById('capVisual');if(!root){root=d.createElement('div');root.id='capVisual';root.innerHTML=`<section class="cap-stats"><div class="cap-stat"><b id="capNewsCount">—</b><span>Noticias climáticas relevantes</span></div><div class="cap-stat"><b id="capCurrentCount">—</b><span>Avisos actuales SENAMHI</span></div><div class="cap-stat"><b id="capPastCount">—</b><span>Avisos pasados SENAMHI</span></div></section><section class="cap-card"><div class="cap-head"><div class="cap-title"><span>🚨</span><div><h2>Zonas con peor estado</h2><div class="cap-sub">Prioridad según avisos oficiales y eventos climáticos detectados en el Perú</div></div></div><div class="cap-status" id="capWorstStatus">Consultando…</div></div><div id="capZones" class="cap-zones"><div class="cap-empty">Consultando alertas…</div></div></section><section class="cap-card"><div class="cap-head"><div class="cap-title"><span>🗺️</span><div><h2>Mapa nacional de eventos y riesgo</h2><div class="cap-sub">Solo Perú · puntos de lluvias, inundaciones, desbordes, huaicos, tormentas y otros eventos</div></div></div><div class="cap-status" id="capMapStatus">Cargando mapa…</div></div><div id="capMap"></div><div class="cap-legend"><span><i class="cap-red"></i>ROJO</span><span><i class="cap-orange"></i>NARANJA</span><span><i class="cap-yellow"></i>AMARILLO</span><span><i class="cap-green"></i>Sin aviso</span></div></section><section class="cap-card"><div class="cap-head"><div class="cap-title"><span>📰</span><div><h2>Noticias climáticas de Perú</h2><div class="cap-sub">Imágenes reales de las publicaciones cuando la fuente las proporciona · SENAMHI y medios peruanos</div></div></div><div class="cap-status" id="capNewsStatus">Cargando…</div></div><div id="capNews" class="cap-news"><div class="cap-empty">Consultando noticias…</div></div></section>`;const hero=d.querySelector('.hero');if(hero)hero.insertAdjacentElement('afterend',root);else d.body.prepend(root)}}
function loadLeaflet(){const d=doc();if(d.defaultView.L)return Promise.resolve(d.defaultView.L);if(leafletPromise)return leafletPromise;leafletPromise=new Promise((resolve,reject)=>{let s=d.getElementById('capLeafletJs');if(!s){s=d.createElement('script');s.id='capLeafletJs';s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>resolve(d.defaultView.L);s.onerror=reject;d.head.appendChild(s)}});return leafletPromise}
function renderZones(alerts){const d=doc(),box=d.getElementById('capZones'),st=d.getElementById('capWorstStatus');if(!box)return;let items=alerts.filter(current).map(a=>({a,s:severity(a)}));if(!items.length){items=newsCache.filter(isNewsRelevant).slice(0,6).map(a=>({a,s:severity(a)}));if(st)st.textContent=items.length?'Eventos recientes detectados':'Sin avisos actuales'}else if(st)st.textContent=items.length+' zonas prioritarias';items=items.slice(0,6);if(!items.length){box.innerHTML='<div class="cap-empty">🟢 No hay avisos oficiales vigentes en este momento.</div>';return}box.innerHTML=items.map(({a,s})=>`<article class="cap-zone ${s[1]}"><span class="cap-badge ${s[1]}">${s[0]}</span><h3>${safe(a.title||a.name||a.alert_type||'Evento climático')}</h3><p>${safe(regionOf(a)||'Perú')} · ${safe(a.description||a.message||'Evento climático detectado.')}</p><div class="cap-meta">${safe(sourceOf(a))} · ${safe(dateOf(a)||'Fecha no indicada')}</div></article>`).join('')}
function renderNews(){const d=doc(),box=d.getElementById('capNews'),st=d.getElementById('capNewsStatus');if(!box)return;const items=newsCache.filter(isNewsRelevant).slice(0,12);if(st)st.textContent=items.length+' noticias';if(d.getElementById('capNewsCount'))d.getElementById('capNewsCount').textContent=items.length;if(!items.length){box.innerHTML='<div class="cap-empty">No se encontraron noticias climáticas relevantes.</div>';return}box.innerHTML=items.map(a=>{const img=newsImage(a),src=sourceOf(a),sev=severity(a);const visual=img?`<img class="cap-news-img" src="${safe(img)}" alt="Imagen de ${safe(a.title||'noticia climática')}" loading="lazy" onerror="this.outerHTML='<div class=&quot;cap-news-placeholder&quot;>📰</div>'>`:'<div class="cap-news-placeholder">📰</div>';return`<article class="cap-news-item">${visual}<div class="cap-news-body"><a href="${safe(a.url||'#')}" target="_blank" rel="noopener">${safe(a.title||'Noticia climática')}</a><div class="cap-news-source">${safe(src)} · ${safe(dateOf(a)||'Fecha reciente')}</div><div class="cap-news-desc">${safe(a.description||'Información climática publicada por una fuente peruana.')}</div><div class="cap-news-tags"><span class="cap-tag">${sev[0]}</span>${regionOf(a)?`<span class="cap-tag">📍 ${safe(regionOf(a))}</span>`:''}</div></div></article>`}).join('')}
function popupFor(a){const s=severity(a),title=a.title||a.name||a.alert_type||'Evento climático',reg=regionOf(a)||'Perú',desc=a.description||a.message||'Información del evento disponible en la fuente.';return`<strong>${safe(title)}</strong><br><b>Nivel:</b> ${s[0]}<br><b>Zona:</b> ${safe(reg)}<br><b>Fuente:</b> ${safe(sourceOf(a))}<br><b>Fecha:</b> ${safe(dateOf(a)||'No indicada')}<br><span>${safe(desc).slice(0,500)}</span>${a.url?`<br><a href="${safe(a.url)}" target="_blank" rel="noopener">Ver información ↗</a>`:''}`}
async function renderMap(){const d=doc(),box=d.getElementById('capMap');if(!box)return;const L=await loadLeaflet();if(!map){map=L.map(box,{scrollWheelZoom:true}).setView([-9.2,-75],5.2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap contributors'}).addTo(map)}markers.forEach(x=>x.remove());markers=[];const events=[...officialCache.filter(current),...newsCache.filter(isNewsRelevant)];PERU.forEach(([name,lat,lon])=>{const matched=events.filter(a=>regionMatch(a,name));const ranks={critical:4,high:3,medium:2,green:1};const best=matched.map(severity).sort((a,b)=>ranks[b[1]]-ranks[a[1]])[0]||['','green'];const color=best[1]==='critical'?'#c53a43':best[1]==='high'?'#e07a00':best[1]==='medium'?'#c19a00':'#1b8d68';const marker=L.circleMarker([lat,lon],{radius:matched.length?9:6,fillColor:color,color:'#fff',weight:2,fillOpacity:.9}).addTo(map);if(matched.length){const body=matched.slice(0,4).map(popupFor).join('<hr style="border:0;border-top:1px solid #ddd;margin:7px 0">');marker.bindPopup(`<strong>🇵🇪 ${safe(name)}</strong><br><b>${matched.length} evento(s)</b><hr style="border:0;border-top:1px solid #ddd;margin:7px 0">${body}`)}else marker.bindPopup(`<strong>🇵🇪 ${safe(name)}</strong><br>Sin evento climático detectado en las fuentes consultadas.`);markers.push(marker)});const st=d.getElementById('capMapStatus');if(st)st.textContent='Perú · '+events.filter(current).length+' avisos actuales · '+newsCache.filter(isNewsRelevant).length+' noticias';setTimeout(()=>map.invalidateSize(),200)}
async function refreshVisuals(){try{injectStyles();ensureUI();const [nr,or]=await Promise.all([fetch(API+'/news?query=Perú%20alerta%20climática',{cache:'no-store'}).then(r=>r.ok?r.json():{articles:[]}).catch(()=>({articles:[]})),fetch(API+'/official-alerts',{cache:'no-store'}).then(r=>r.ok?r.json():{alerts:[]}).catch(()=>({alerts:[]}))]);newsCache=Array.isArray(nr)?nr:(nr.articles||nr.news||[]);officialCache=Array.isArray(or)?or:(or.alerts||[]);const currentCount=officialCache.filter(current).length,pastCount=officialCache.filter(a=>!current(a)).length,d=doc();if(d.getElementById('capCurrentCount'))d.getElementById('capCurrentCount').textContent=currentCount;if(d.getElementById('capPastCount'))d.getElementById('capPastCount').textContent=pastCount;renderZones(officialCache);renderNews();await renderMap()}catch(e){console.warn('Climate Alert visual layer:',e)}}
frame.addEventListener('load',()=>{setTimeout(refreshVisuals,500);setTimeout(refreshVisuals,2500)});setInterval(refreshVisuals,60000);
</script>

<script>
(function(){const cover=document.getElementById('projectCover');const frame=document.getElementById('dashboardFrame');function enter(target){if(!cover)return;cover.style.opacity='0';cover.style.transition='opacity .35s ease';setTimeout(()=>{cover.remove();if(target)frame.contentWindow.postMessage({action:target},'*')},350)}document.getElementById('enterDashboard')?.addEventListener('click',()=>enter('dashboard'));document.getElementById('coverAlerts')?.addEventListener('click',()=>enter('alerts'));})();
</script>
